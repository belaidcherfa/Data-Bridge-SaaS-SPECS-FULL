# contract=authz-roles version=1 status=DRAFT owner_task=SEC-004 decisions=D-02,D-10,D-20,D-25 last_changed=2026-09-28
# =====================================================================================================
# Role x capability matrix (SEC-004-S02; SEC backlog Appendix C.2/C.3; PRD §114 role names - UI labels MUST use
# display_name, never "FinOps admin / Group viewer / Platform admin" (G-SEC-04, UX correction).
# Capability ids: contracts/authz/capabilities.yaml. Scope grammar: contracts/authz/scope.schema.json.
# The roles section is generated from a compact matrix (scratch generator kept with the lane); edit both together.
# Maker/checker roles are NOT encoded here: they follow from approval_policies in capabilities.yaml
# (a role holding a checker capability can approve, never its own request or its own last edit).
# Capabilities absent from a role's map are NEVER (not even grantable). finance.org_scope.read is derived from the
# scope (organization-level atom) and therefore absent from every role map.
# =====================================================================================================
