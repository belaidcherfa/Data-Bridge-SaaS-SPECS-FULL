    client_application, workload_type, workload, environment, dbt_project, dbt_model, dbt_resource_type, pbi_mode, query_parameterized_hash, evidence_class]
  use: {metric: attributed_cost, version: 1}
  residual_row_key: __UNATTRIBUTED__
  banner_key: analytics.substitution.attributed_cost.banner
explain_template:
  root_kind: METRIC
  formula_ref: packages/semantic_metrics/README.md#spend
  child_resolvers: [charge_by_service, charge_bucket]
screen_keys: [spend, accountcost, orgnet, storage, serverless, cortex, spcs, taskcost, pipecost, otherServerless, aifunctioncost, aisearchcost, aianalystcost, appfees]
owner_task: API-001
notes: 'Signed net Σ fct_charge.cost_effective at D-12 bucket grain (canonical: semantic-api.md ''spend''). Grouping by any resource/actor/workload dimension is rewritten to attributed_cost@1
  and returns meta.metric_substitution; group/tag dimensions are refused (use allocated_spend). Organization-only adjustments are never copied to accounts: at account scope they are
  absent, and a tile that asks for them gets null NOT_APPLICABLE.'
