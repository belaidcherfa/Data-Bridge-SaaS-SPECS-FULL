    domain: FIN
    layer: ledger
    materialization: revisioned
    physical: {schema: ledger, table: fct_ledger_freshness_r}
    grain: "One row per (scope, usage_date, source_family) with money_complete_through and billing_complete_through (D-24)."
    unique_key: [tenant_id, scope_id, usage_date, source_family]
    tenant_key: tenant_id
