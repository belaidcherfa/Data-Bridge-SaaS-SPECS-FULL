# contract=semantic-relation:v_dim_workload version=1 status=DRAFT owner_task=API-001 decisions=D-02,D-05,D-11,D-12 last_changed=2026-09-28
# Serving relation bound by the v1 registry (API-001-S03). Physical view: bridge.serving.serving_dim_workload
# The deployed secure view must expose exactly these columns (API-101-S01 drift check).
id: v_dim_workload
version: 1
status: ACTIVE
release: R1
kind: DICTIONARY
description: Workload (project/application × environment) labels for the workload and dbt_project dimensions.
serving_view: bridge.serving.serving_dim_workload
dataset_id: dim_workload
dbt_model: dim_workload
upstream_owner_tasks: [WRK-001]
grain_keys: [tenant_id, workload_key]
tenant_column: tenant_id
time: {column: null, type: NONE, grain: NONE}
publication: {pinned: true, pub_from_column: _pub_from, pub_to_column: _pub_to}
policy:
  row_access_policy: RAP_ACCOUNT_SCOPED
  policy_columns: [tenant_id, organization_id, account_id]
  readable_by: ACCOUNT_SCOPED_PROFILES
tier: FULL
retention: {days: null, basis: FIXED, reference: Workload identities observed in the last 400 days}
entitlement_dimensions: [organization, account]
currency_column: null
data_status_column: null
required_sources: []
columns:
- {name: tenant_id, type: VARCHAR(36), nullable: false, role: KEY, privacy: INTERNAL, description: 'Tenant (UUIDv7, lowercase). First predicate of every compiled query (pruning); isolation
    is enforced by the row access policy.'}
- {name: workload_key, type: VARCHAR(64), nullable: false, role: KEY, privacy: INTERNAL, description: 'sha256(tenant, account, workload_type, project_key, environment_key) (WRK-001-S05).'}
- {name: organization_id, type: VARCHAR(36), nullable: false, role: DIMENSION, privacy: INTERNAL, description: Internal organization id (DBT-003 durable id).}
- {name: account_id, type: VARCHAR(36), nullable: false, role: DIMENSION, privacy: INTERNAL, description: Internal account id (DBT-003 durable id).}
- name: workload_type
  type: VARCHAR(24)
  nullable: false
  role: DIMENSION
  privacy: INTERNAL
  enum_values: [DBT, POWER_BI, TASK, PROCEDURE, DYNAMIC_TABLE, SNOWPIPE, NATIVE_APP, SPCS, CORTEX, CUSTOM_APP, BI_OTHER, AD_HOC, BRIDGE_OVERHEAD, UNKNOWN]
- {name: workload_name, type: VARCHAR, nullable: false, role: LABEL, privacy: CUSTOMER_METADATA}
- {name: project_key, type: VARCHAR(64), nullable: true, role: DIMENSION, privacy: INTERNAL}
- name: project_basis
  type: VARCHAR(16)
  nullable: true
  role: STATUS
  privacy: INTERNAL
  enum_values: [PROJECT_NAME, NODE_PACKAGE]
- name: environment
  type: VARCHAR(12)
  nullable: false
  role: DIMENSION
  privacy: INTERNAL
  enum_values: [PRODUCTION, STAGING, DEV, OTHER, UNKNOWN]
- {name: environment_raw_label, type: VARCHAR, nullable: true, role: LABEL, privacy: CUSTOMER_METADATA}
- {name: first_observed_at, type: TIMESTAMP_NTZ(9), nullable: false, role: PROVENANCE, privacy: INTERNAL}
- {name: last_observed_at, type: TIMESTAMP_NTZ(9), nullable: false, role: PROVENANCE, privacy: INTERNAL}
- {name: _pub_from, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: First pub_seq at which the row's revision is published (ADR-014 §7).}
- {name: _pub_to, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: pub_seq at which the revision was superseded; 9223372036854775807 while current.}
owner_task: API-001
