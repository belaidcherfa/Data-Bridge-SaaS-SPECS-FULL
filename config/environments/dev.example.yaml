# contract=owner-environment-config-template version=1 status=DRAFT owner_task=INF-001 decisions=D-09,D-21,D-23,D-25,D-32 last_changed=2026-09-28
# TEMPLATE for config/environments/dev.yaml (DEV workload account + BRIDGE_DEV Snowflake account).
#
# How to use:
#   1. cp config/environments/dev.example.yaml config/environments/dev.yaml
#   2. Replace every <PLACEHOLDER> with the real identifier (see config/README.md for where to find each).
#   3. make config-validate            # schema + "no placeholder left" + cross-file consistency
#
# NOTHING IN THIS FILE IS A SECRET. Never put passwords, private keys, PATs, access keys, session tokens,
# webhook URLs containing tokens or IdP signing keys here. Store those in AWS Secrets Manager / SSM and
# reference only their NAME (fields ending in *_secret_name or *_ssm_parameter).
# While the repository is public, config/environments/.gitignore keeps dev.yaml out of git.

schema_version: 1
environment: dev

organization:                                   # identical in dev/staging/prod files
  aws_organization_id: "<AWS_ORGANIZATION_ID>"          # o-xxxxxxxxxx (Organizations console → Settings)
  management_account_id: "<AWS_MANAGEMENT_ACCOUNT_ID>"  # 12 digits; billing + Organizations only
  security_account_id: "<AWS_SECURITY_ACCOUNT_ID>"
  log_archive_account_id: "<AWS_LOG_ARCHIVE_ACCOUNT_ID>"
  shared_services_account_id: "<AWS_SHARED_SERVICES_ACCOUNT_ID>"
  account_email_domain: "<ACCOUNT_EMAIL_DOMAIN>"        # root e-mail aliases aws+<account>@<domain>
  identity_center:
    instance_arn: "<IDENTITY_CENTER_INSTANCE_ARN>"      # arn:aws:sso:::instance/ssoins-<16 hex>
    identity_store_id: "<IDENTITY_STORE_ID>"            # d-xxxxxxxxxx
    region: eu-west-1
    external_idp: NONE                                  # NONE | OKTA | ENTRA_ID | GOOGLE_WORKSPACE | OTHER_SAML

aws:
  account_id: "<AWS_ACCOUNT_ID_DEV>"             # the DEV workload account
  region: eu-west-1                              # fixed for R1 (D-23)
  global_region: us-east-1                       # CloudFront certificates, CLOUDFRONT WAF, CloudFront alarms
  az_ids: ["<AZ_ID_A>", "<AZ_ID_B>"]             # AZ IDs, e.g. euw1-az1, euw1-az2 (aws ec2 describe-availability-zones)
  reserved_az_id: "<AZ_ID_C>"                    # e.g. euw1-az3 (CIDRs reserved, no subnets in R1)
  support_plan: DEVELOPER

dns:
  apex_domain: "<APEX_DOMAIN>"                   # e.g. bridge-data.example (product domain, INF owner question 2)
  apex_hosted_zone_id: "<APEX_HOSTED_ZONE_ID>"   # public zone in the shared-services account
  environment_zone_name: "<DEV_ZONE_NAME>"       # e.g. dev.<apex>
  app_hostname: "<DEV_APP_HOSTNAME>"             # e.g. app.dev.<apex>  (SPA + /api/* through CloudFront, D-28)
  auth_hostname: "<DEV_AUTH_HOSTNAME>"           # e.g. auth.dev.<apex> (Cognito custom domain)
  email:
    sender_domain: "<DEV_EMAIL_SENDER_DOMAIN>"   # e.g. notify.dev.<apex>
    mail_from_domain: "<DEV_MAIL_FROM_DOMAIN>"   # e.g. mail.notify.dev.<apex>
    from_address: "<DEV_FROM_ADDRESS>"           # e.g. no-reply@notify.dev.<apex>
    dmarc_report_address: "<DMARC_REPORT_ADDRESS>"
    dmarc_policy: NONE

github:
  organization: "<GITHUB_ORG>"
  repository: "<GITHUB_REPO>"
  repository_owner_id: "<GITHUB_REPOSITORY_OWNER_ID>"   # gh api repos/<org>/<repo> --jq .owner.id
  repository_id: "<GITHUB_REPOSITORY_ID>"               # gh api repos/<org>/<repo> --jq .id
  environment_name: dev
  runner_label: bridge-dev-vpc
  visibility: PUBLIC                             # set PRIVATE once the owner has made the repository private

snowflake:
  central:                                       # BRIDGE_DEV (Enterprise, AWS eu-west-1)
    organization_name: "<SNOWFLAKE_ORG_NAME>"    # SELECT CURRENT_ORGANIZATION_NAME();
    account_name: "<SNOWFLAKE_DEV_ACCOUNT_NAME>" # e.g. BRIDGE_DEV; SELECT CURRENT_ACCOUNT_NAME();
    account_locator: "<SNOWFLAKE_DEV_LOCATOR>"   # SELECT CURRENT_ACCOUNT();
    region: AWS_EU_WEST_1                        # SELECT CURRENT_REGION();
    cloud: AWS
    edition: ENTERPRISE
  sso:                                           # SAML2 integration for human PERSON users (FND-101: DEV only)
    idp_issuer: "<SNOWFLAKE_SSO_IDP_ISSUER>"
    idp_sso_url: "<SNOWFLAKE_SSO_IDP_SSO_URL>"
    idp_certificate_ssm_parameter: "/bridge/dev/snowflake/sso/idp-certificate"

notifications:
  ops_alert_email: "<OPS_ALERT_EMAIL>"           # role mailbox, not a person
  cost_alert_email: "<COST_ALERT_EMAIL>"
  security_alert_email: "<SECURITY_ALERT_EMAIL>"
  chat_webhook_secret_name: "bridge/dev/notifications/ops-chat-webhook"   # NAME only; the URL lives in Secrets Manager
  test_destinations:
    email_recipients: ["<TEST_INBOX_EMAIL_1>"]   # Bridge-owned test inboxes (verified SES identities while in sandbox)
    slack_webhook_secret_name: "bridge/dev/notifications/test-slack-webhook"
    teams_webhook_secret_name: "bridge/dev/notifications/test-teams-webhook"
    webhook_receiver_url: "<TEST_WEBHOOK_RECEIVER_URL>"                    # https, no token, no query string

budgets:                                         # USD / credits as decimal strings (CONVENTIONS §5)
  aws_monthly_usd: "450"                         # proposal INF-105 (owner approval recorded in docs/runbooks/cost-baseline.md)
  organization_accounts_monthly_usd: "40"
  actual_alert_pct: [80, 100]
  forecast_alert_pct: [100]
  anomaly_absolute_usd: "50"
  anomaly_relative_pct: 20
  snowflake_central_monthly_credits: "150"       # BRIDGE_DEV account monitor, suspend at 100 % (INF-008-S09)
  snowflake_nonprod_ceiling_credits: "500"       # D-32

egress:                                          # leave empty; filled from terraform output after INF-002 apply
  eip_allocation_ids: []
  public_ips: []

features:
  interface_endpoints: false                     # DEV uses NAT only (G-INF-06 cost trap 1)
  guardduty_ecs_runtime_monitoring: false
  security_hub_fsbp: true
  snowflake_account_network_policy: false        # humans reach BRIDGE_DEV via SSO; service users keep user-level policies
  dev_off_hours_scale_to_zero: true
  broker_transport: VPC_LATTICE_SIGV4
  dagster_admin_webserver: false
  dns_firewall_custom_allowlist_mode: ALERT
  waf_anonymous_ip_mode: COUNT
  cur_export: false
