  - {id: SCP-13, scp: bridge-scp-deny-root, principal: "root user of bridge-dev (drill with approval)", call: "s3:ListAllMyBuckets", expect: DENY_SCP}
  - {id: SCP-14, scp: bridge-scp-deny-iam-users, principal: "role/bridge-dev-tf-apply", call: "iam:CreateUser --user-name scp-test", expect: DENY_SCP}
