extractor_columns:
- transport_name: is_bridge_overhead
  arrow_type: bool
  raw_type: BOOLEAN
  nullable: false
  privacy_class: INTERNAL
  rule: TRUE iff (WAREHOUSE_NAME, USER_NAME) is ('BRIDGE_FINOPS_WH','BRIDGE_FINOPS_READER_USER') or ('BRIDGE_FINOPS_ORG_WH','BRIDGE_FINOPS_ORG_USER'), compared on
    plaintext in process before pseudonymization (ING-107 order step 1, G-CON-11); QUERY_TAG is never used for this flag; Bridge overhead is never excluded from totals.
  owner_task: CON-101
- transport_name: query_text_mode
  arrow_type: large_string
  raw_type: VARCHAR(16)
  nullable: false
  privacy_class: INTERNAL
  rule: 'HOT_SANITIZED (window inside hot_days, sanitizer succeeded) | COLD_FRAGMENT (window older than hot_days: only the tail comment was read and parsed by WRK-101,
    no text stored) | METADATA_ONLY (sanitizer failure, text null, ING-107-S06) | OMITTED_SIZE (QUERY_TEXT > limits.oversized_text_bytes, ING-003-S08) | NONE (tenant
    privacy mode METADATA_ONLY).'
  owner_task: ING-107
