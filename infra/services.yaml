# contract=service-catalog version=1 status=DRAFT owner_task=INF-005 decisions=D-07,D-22,D-28,D-33 last_changed=2026-09-28
# ECS service catalog (INF-005-S01). Schema: infra/services.schema.json. Placeholders: {env} ∈ dev|staging|prod,
# {uuid32} = 32 lowercase hex of a connection UUID. There is NO frontend service (SPA on S3 + CloudFront OAC, D-28).
# Pool sizes: infra/capacity/pg-pool-budget.yaml. Security groups: infra/network/sg-matrix.yaml. Task-role policies:
# infra/iam/policies/task-<name>.json. Snowflake users: infra/snowflake/objects.yaml. CPU/memory are initial values to be
# benchmarked (platform.md: "do not invent CPU/RAM counts as proven sizing").
schema_version: 1
defaults:
  cpu_architecture: ARM64
  user: '10001'
  readonly_root_filesystem: true
  init_process_enabled: true
  tmpfs:
  - path: /tmp
    size_mib: 512
  stop_timeout_s: 120
  log_retention_days:
    dev: 7
    staging: 30
    prod: 90
  deployment:
    minimum_healthy_percent: 100
    maximum_percent: 200
    circuit_breaker_rollback: true
  image_repo_prefix: <SHARED_SERVICES_ACCOUNT_ID>.dkr.ecr.eu-west-1.amazonaws.com/
  role_name_pattern: bridge-{env}-{service}
  exec_role_name_pattern: bridge-{env}-{service}-exec
services:
- name: api
  kind: SERVICE
  description: FastAPI BFF and public API (/v1). Reads through the query broker only; never assumes tenant identities.
  owner_task: INF-005, API-001
  package: apps/api
  image_repo: bridge/api
  cpu: 1024
  memory_mib: 2048
  counts:
    dev:
      desired: 1
      min: 1
      max: 2
    staging:
      desired: 2
      min: 2
      max: 4
    prod:
      desired: 2
      min: 2
      max: 6
  task_role: bridge-{env}-api
  execution_role: bridge-{env}-api-exec
  policy_file: infra/iam/policies/task-api.json
  security_groups:
  - sg-api
  health_check:
    type: HTTP
    path: /healthz
    interval_s: 15
    timeout_s: 5
    retries: 3
    start_period_s: 30
  spot_eligible: 'NO'
  ephemeral_storage_gib: 21
  ports:
  - name: http
    port: 8000
    protocol: HTTP
    exposed_via: INTERNAL_ALB
  autoscaling:
    metric: CPU
    target: '60'
  database:
    db_user: bridge_api
    database: bridge_control
    auth: IAM_TOKEN
  secrets:
  - env_var: COGNITO_BFF_CLIENT_SECRET
    secret_name: bridge/{env}/cognito/bff-client-secret
    injected_by: EXECUTION_ROLE
  stop_timeout_s: 30
- name: query-broker
  kind: SERVICE
  description: 'D-22 query broker: the only principal allowed to assume bridge-{env}-srv-* roles and open tenant-user Snowflake sessions (WIF impersonation path). Reached from the API by SigV4 through VPC
    Lattice.'
  owner_task: INF-005, API-002, SEC-005
  package: services/query_broker
  image_repo: bridge/query-broker
  cpu: 1024
  memory_mib: 2048
  counts:
    dev:
      desired: 1
      min: 1
      max: 2
    staging:
      desired: 2
      min: 2
      max: 3
    prod:
      desired: 2
      min: 2
      max: 4
  task_role: bridge-{env}-query-broker
  execution_role: bridge-{env}-query-broker-exec
  policy_file: infra/iam/policies/task-query-broker.json
  security_groups:
  - sg-broker
  health_check:
    type: HTTP
    path: /healthz
    interval_s: 15
    timeout_s: 5
    retries: 3
    start_period_s: 30
  spot_eligible: 'NO'
  ephemeral_storage_gib: 21
  ports:
  - name: https
    port: 8443
    protocol: HTTPS
    exposed_via: VPC_LATTICE_IAM
  autoscaling:
    metric: CPU
    target: '60'
  database:
    db_user: bridge_broker
    database: bridge_control
    auth: IAM_TOKEN
  snowflake_user: TENANT_USERS_VIA_IMPERSONATION
  stop_timeout_s: 60
- name: sync-api
  kind: SERVICE
  description: Internal API used by extractor tasks to claim leases, report progress and commit manifests (D-07). Authenticated by the caller's AWS role (SigV4, Lattice IAM auth policy allows bridge-{env}-conn-*
    sessions).
  owner_task: ING-106, INF-005
  package: services/sync_api
  image_repo: bridge/sync-api
  cpu: 512
  memory_mib: 1024
  counts:
    dev:
      desired: 1
      min: 1
      max: 1
    staging:
      desired: 1
      min: 1
      max: 2
    prod:
      desired: 2
      min: 2
      max: 4
  task_role: bridge-{env}-sync-api
  execution_role: bridge-{env}-sync-api-exec
  policy_file: infra/iam/policies/task-sync-api.json
  security_groups:
  - sg-sync-api
  health_check:
    type: HTTP
    path: /healthz
    interval_s: 15
    timeout_s: 5
    retries: 3
    start_period_s: 30
  spot_eligible: 'NO'
  ephemeral_storage_gib: 21
  ports:
  - name: https
    port: 8080
    protocol: HTTPS
    exposed_via: VPC_LATTICE_IAM
  autoscaling:
    metric: CPU
    target: '60'
  database:
    db_user: bridge_worker
    database: bridge_control
    auth: IAM_TOKEN
- name: extraction-launcher
  kind: SERVICE
  description: Claims ADMITTED account-cycles from PostgreSQL, resolves connection_id → bridge-{env}-conn-<uuid32> server-side and calls ecs:RunTask on bridge-{env}-extractor with that task role and clientToken
    = cycle idempotency key. Only holder of iam:PassRole on conn roles.
  owner_task: ING-106, INF-005-S08
  package: services/launcher
  image_repo: bridge/extraction-launcher
  cpu: 256
  memory_mib: 512
  counts:
    dev:
      desired: 1
      min: 1
      max: 1
    staging:
      desired: 1
      min: 1
      max: 1
    prod:
      desired: 2
      min: 2
      max: 2
  task_role: bridge-{env}-extraction-launcher
  execution_role: bridge-{env}-extraction-launcher-exec
  policy_file: infra/iam/policies/task-extraction-launcher.json
  security_groups:
  - sg-launcher
  health_check:
    type: COMMAND
    command:
    - CMD
    - /app/healthcheck
    interval_s: 30
    timeout_s: 5
    retries: 3
    start_period_s: 30
  spot_eligible: 'NO'
  ephemeral_storage_gib: 21
  database:
    db_user: bridge_worker
    database: bridge_control
    auth: IAM_TOKEN
  autoscaling:
    metric: NONE
    target: '0'
- name: extractor
  kind: TASK_FAMILY
  description: One task per account-cycle (D-07), started only by the extraction launcher. Default task role has no permissions; the launcher overrides it with the connection's role. Holds no database credentials;
    talks to sync-api and S3 landing only. Max = concurrent tasks (8 steady + 2 backfill in prod).
  owner_task: ING-003, INF-005-S08
  package: services/extractor
  image_repo: bridge/extractor
  cpu: 1024
  memory_mib: 4096
  counts:
    dev:
      desired: 0
      min: 0
      max: 2
    staging:
      desired: 0
      min: 0
      max: 4
    prod:
      desired: 0
      min: 0
      max: 10
  task_role: bridge-{env}-extractor-null
  execution_role: bridge-{env}-extractor-exec
  policy_file: infra/iam/policies/task-extractor-null.json
  security_groups:
  - sg-extractor
  health_check: &id001
    type: NONE
  spot_eligible: BACKFILL_ONLY
  ephemeral_storage_gib: 50
  task_role_override: bridge-{env}-conn-{uuid32}
- name: receipt-consumer
  kind: SERVICE
  description: Consumes landing-receipts (S3 → SNS → SQS), validates keys/manifests, runs D-03 repair COPY, writes CONTROL.ACCEPTED_BATCHES as SVC_INGEST.
  owner_task: ING-007, INF-005
  package: services/ingestion
  image_repo: bridge/receipt-consumer
  cpu: 512
  memory_mib: 1024
  counts:
    dev:
      desired: 1
      min: 1
      max: 1
    staging:
      desired: 1
      min: 1
      max: 2
    prod:
      desired: 2
      min: 2
      max: 4
  task_role: bridge-{env}-receipt-consumer
  execution_role: bridge-{env}-receipt-consumer-exec
  policy_file: infra/iam/policies/task-receipt-consumer.json
  security_groups:
  - sg-workers
  health_check:
    type: COMMAND
    command:
    - CMD
    - /app/healthcheck
    interval_s: 30
    timeout_s: 5
    retries: 3
    start_period_s: 30
  spot_eligible: 'NO'
  ephemeral_storage_gib: 21
  queues:
  - landing-receipts
  autoscaling:
    metric: SQS_BACKLOG_PER_TASK
    target: '100'
    queue: landing-receipts
  database:
    db_user: bridge_worker
    database: bridge_control
    auth: IAM_TOKEN
  snowflake_user: SVC_INGEST
- name: dagster-webserver-ro
