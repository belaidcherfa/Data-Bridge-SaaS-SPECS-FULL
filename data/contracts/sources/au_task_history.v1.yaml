notes:
- 'Completion-time sweep (ADR-006 amendment 1): every completed row falls into exactly one COMPLETED_TIME window whatever its duration; coverage means ''all rows
  completed before T''. The SCHEDULED_TIME bound is only a pruning hint (7-day maximum statement timeout + 1 day).'
- 'retention_class FINANCIAL: execution-level facts are 400-day facts (RECONCILIATION C-01 (3)) and the source carries no user identity.'
