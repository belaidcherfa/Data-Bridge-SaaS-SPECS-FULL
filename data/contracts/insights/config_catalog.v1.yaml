  - {key: st01.window_days, type: INTEGER, default: 30, min: 30, max: 365, tenant_overridable: false, owner_task: INS-104, description: "R2."}
  - {key: st03.tt_fraction_threshold, type: DECIMAL, default: "0.30", min: "0.05", max: "0.95", tenant_overridable: true, owner_task: INS-004, description: "Time-travel fraction threshold (every snapshot)."}
  - {key: st03.min_snapshots, type: INTEGER, default: 14, min: 14, max: 14, tenant_overridable: false, owner_task: INS-004, description: "Consecutive complete daily snapshots; eligible_on = first_snapshot_date + (value − 1) days."}
  - {key: st04.fs_fraction_threshold, type: DECIMAL, default: "0.30", min: "0.05", max: "0.95", tenant_overridable: true, owner_task: INS-004, description: "Fail-safe fraction threshold."}
