# contract=security-group-matrix version=1 status=DRAFT owner_task=INF-002 decisions=D-07,D-22,D-28,D-33 last_changed=2026-09-28
# Security-group matrix (INF-002-S06): source of infra/terraform/modules/security_groups and of the generated
# docs/runbooks/sg-matrix.md. `from`/`to` are security-group names, CIDRs or AWS managed prefix lists. Rules are the
# complete allowlist: anything not listed is denied. Reachability expectations are INF-002-S10/INF-006-S14/INF-005-S11 oracles.
schema_version: 1
invariants:
- No ingress rule from 0.0.0.0/0 or ::/0 on any security group.
- Data security groups (sg-aurora, sg-valkey, sg-endpoints) have no egress rules.
- Only sg-alb-internal accepts traffic originating outside the VPC, and only from the CloudFront VPC-origin source.
- No task has a public IP (Security Hub ECS.2).
security_groups:
- name: sg-alb-internal
  attached_to:
  - internal ALB
  ingress:
  - from: CloudFront VPC-origin source (managed prefix list com.amazonaws.global.cloudfront.origin-facing or the CloudFront VPC-origins service security group — TO VERIFY LIVE, INF-006-S07)
    port: 443
    protocol: tcp
    why: /api/* from CloudFront only (D-28)
  - from: sg-ops-bastion
    port: 8443
    protocol: tcp
    why: private listener for the ops console/API (CTL-102)
  - from: sg-runners
    port: 443
    protocol: tcp
    why: post-deploy smoke tests from in-VPC runners
  egress:
  - to: sg-api
    port: 8000
    protocol: tcp
    why: API target group
  - to: sg-ops-api
    port: 8000
    protocol: tcp
    why: ops API target group
- name: sg-api
  attached_to:
  - api
  ingress:
  - from: sg-alb-internal
    port: 8000
    protocol: tcp
    why: ALB target
  egress:
  - &id001
    to: 0.0.0.0/0
    port: 443
    protocol: tcp
    why: AWS APIs via NAT/endpoints, Snowflake, Cognito, VPC Lattice (443)
  - to: sg-aurora
    port: 5432
    protocol: tcp
    why: PostgreSQL (IAM auth / rotated secret)
  - &id002
    to: sg-valkey
    port: 6379
    protocol: tcp
    why: cache (TLS)
- name: sg-ops-api
  attached_to:
  - ops-api
  ingress:
  - from: sg-alb-internal
    port: 8000
    protocol: tcp
    why: ALB private listener target
  egress:
  - *id001
  - to: sg-aurora
    port: 5432
    protocol: tcp
    why: PostgreSQL (IAM auth / rotated secret)
- name: sg-broker
  attached_to:
  - query-broker
  ingress:
  - from: VPC Lattice managed prefix list (com.amazonaws.eu-west-1.vpc-lattice)
    port: 8443
    protocol: tcp
    why: Lattice service; IAM auth policy admits only api, analysis-worker, render-worker, monitor-worker, intelligence-worker, run-worker-python roles (D-22, D-33, C-09)
  - from: sg-api, sg-workers, sg-run-workers (only when features.broker_transport = SERVICE_CONNECT_SG)
    port: 8443
    protocol: tcp
    why: fallback transport
  egress:
  - *id001
  - to: sg-aurora
    port: 5432
    protocol: tcp
    why: PostgreSQL (IAM auth / rotated secret)
  - *id002
- name: sg-sync-api
  attached_to:
  - sync-api
  ingress:
  - from: VPC Lattice managed prefix list (com.amazonaws.eu-west-1.vpc-lattice)
    port: 8080
    protocol: tcp
    why: extractor tasks sign with their bridge-{env}-conn-* session (IAM auth policy)
  - from: sg-extractor (only when features.broker_transport = SERVICE_CONNECT_SG)
    port: 8080
    protocol: tcp
    why: fallback transport
  egress:
  - *id001
  - to: sg-aurora
    port: 5432
    protocol: tcp
    why: PostgreSQL (IAM auth / rotated secret)
- name: sg-launcher
  attached_to:
  - extraction-launcher
  ingress: []
  egress:
  - *id001
  - to: sg-aurora
    port: 5432
    protocol: tcp
    why: PostgreSQL (IAM auth / rotated secret)
- name: sg-extractor
  attached_to:
  - extractor
  ingress: []
  egress:
  - to: 0.0.0.0/0
    port: 443
    protocol: tcp
    why: customer Snowflake hosts (validated in code; private/link-local IPs blocked), S3 landing via gateway endpoint, sync-api via Lattice
- name: sg-workers
  attached_to:
  - receipt-consumer
  - analysis-worker
  - render-worker
  - monitor-worker
  - notification-worker
  - intelligence-worker
  - control-worker
