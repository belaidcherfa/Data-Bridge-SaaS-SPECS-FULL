# contract=datasets version=1 status=DRAFT owner_task=DBT-101 decisions=D-05,D-06,D-11,D-12,D-26 last_changed=2026-09-28
# Analytical dataset catalog (ADR-014 decision 1; DBT-101-S02; G-DBT-02).
# Every R1 dataset that is written as insert-only revisioned partitions and published through the SCD2
# PUBLICATION_MAP is listed under `datasets`. Validated by data/contracts/datasets.schema.json.
# The release pipeline syncs this file into BRIDGE.OPS_META.DATASET and OPS_META.DATASET_PARTITION_RULE
# (infra/snowflake/migrations/ops_meta/V0301__processing_ledger.sql); dbt model meta (config.meta.bridge,
# data/contracts/dbt_meta.schema.json) must agree with the entry of the same dataset_id (lint L01/L02).
#
# Physical conventions (all datasets):
#   * table bridge.<physical.schema>.<physical.table> with leading columns
#     tenant_id VARCHAR(36), scope_id VARCHAR(36), partition_start TIMESTAMP_NTZ(9), revision_id NUMBER(38,0), build_id VARCHAR(36)
#     (template data/contracts/templates/revision_table.sql);
#   * partition key = (tenant_id, scope_id, partition_start); partition_start = DATE_TRUNC(granularity, time_column) in UTC,
#     or the constant 1970-01-01T00:00:00 for granularity ALL;
#   * the row access policy named under `rap` is attached at CREATE time (never after); `args` are table columns;
#   * content columns (business columns) are owned by the dataset's owner_task contract, not by this catalog.
# Money columns are NUMBER(38,12); no FLOAT anywhere (no_float_columns).
contract: datasets
version: 1
registry_version: 1
status: DRAFT
owner_task: DBT-101
decisions: [D-05, D-06, D-11, D-12, D-26]
last_changed: "2026-09-28"

defaults:
  database: bridge
  partition_columns: [tenant_id, scope_id, partition_start]
  revision_columns: [revision_id, build_id]
  clustering: [tenant_id, partition_start]
  time_travel_days: 1                  # ORC-105-S07; rollback uses superseded revisions, recovery uses OPS-007 snapshots (C-02)
  superseded_retention_days: 7         # RB-07 rollback window; GC grace = max(cursor_ttl_seconds + 15 min, 7 d)
  orphan_retention_hours: 24           # CANDIDATE revisions of terminal builds
  automatic_clustering: SUSPENDED_INITIALLY   # enabled per table after the DBT-101-S09 benchmark
  all_partition_start: "1970-01-01T00:00:00"

partition_rules:
  identity: "Downstream partition (tenant, scope, p) depends on the upstream partition with the same tenant, scope and partition_start. Both datasets must share scope and granularity."
  hour_to_day: "Downstream day partition (tenant, scope, d) depends on the 24 upstream hour partitions [d, d + 1 day) of the same scope; an upstream hour h marks downstream day DATE_TRUNC(day, h)."
  day_to_month: "Downstream month partition (tenant, scope, m) depends on the upstream day partitions [m, m + 1 month) of the same scope."
  account_to_org: "Downstream ORGANIZATION (or TENANT) scope partition depends on every upstream ACCOUNT scope partition of the same partition_start whose account belongs to the organization (dim_account_membership valid at partition_start)."
  org_to_accounts: "Upstream ORGANIZATION scope partition (tenant, org, p) marks every downstream ACCOUNT_OR_ORGANIZATION scope partition of that organization at the same partition_start: the organization itself and each member account (dim_account_membership valid at p)."
  tenant_all_open: "Any change of the upstream (tenant-level configuration or dimension) marks every downstream partition of the tenant whose accounting period is open (not CLOSED in ledger.fct_period_close for the partition's scope). Closed periods are rebuilt only by a REPAIR build with reason RESTATEMENT (FIN-107)."
  scope_all_open: "A change of the upstream ALL-granularity partition (tenant, scope) marks every downstream partition of the same scope from the earliest changed validity date (valid_from of the changed dimension rows) forward, restricted to open periods."

source_rules:
  window_hours: "Accepted batch window [ws, we) marks the hour partitions of the batch's account intersecting [ws - overlap_hours, we + overlap_hours)."
  window_hours_to_day: "Accepted hourly batch window [ws, we) marks the day partitions (UTC) containing any hour of [ws - overlap_hours, we + overlap_hours) for the batch's account."
  window_days: "Accepted daily batch window [ds, de) marks the day partitions of the batch's scope (account, or organization for ORG sources) in [ds, de)."
  org_day_fanout: "An ORG-scope daily batch (organization, day) marks the day partition of the organization and of every member account of that organization (dim_account_membership valid at the day)."
  snapshot_scope_all: "A SNAPSHOT batch marks the ALL partition of the batch's scope (account, or organization for ORG sources)."
  config_version_tenant_open: "A newly ACCEPTED config version of the kind (CONFIG.CONFIG_VERSION header complete, D-04) marks every partition of the tenant in open periods whose effective dates intersect the version's effective range (ORC-101-S05)."

retention_classes:
  FINANCIAL:        {retention_days: 400, rebuild_horizon_days: 400, beyond_horizon: REFUSE, policy_owner: OPS-005, basis: "D-26: billing/metering/storage journal and RAW kept 400 d; canonical facts 400 d; closed-statement evidence is pinned (FIN-010)."}
  QUERY_GRAIN:      {retention_days: hot_days, rebuild_horizon_days: 90, beyond_horizon: RE_EXTRACT, policy_owner: WRK-104, basis: "D-11: query-level detail hot_days (default 365, plan-configurable); D-26: query-grain RAW 90 d, older days rebuilt only by re-extraction within Account Usage retention (365 d)."}
  EXECUTION:        {retention_days: 400, rebuild_horizon_days: 90, beyond_horizon: CARRY_FORWARD, policy_owner: WRK-104, basis: "RECONCILIATION C-01(3): execution-level facts 400 d; inputs are query-grain, so partitions older than 90 d are carried forward."}
  AGGREGATE:        {retention_days: 400, rebuild_horizon_days: 90, beyond_horizon: CARRY_FORWARD, policy_owner: WRK-104, basis: "D-11: family x day aggregates with sketches 400 d; beyond the query-grain RAW horizon they are canonical and carried forward."}
  DIMENSION:        {retention_days: 400, rebuild_horizon_days: 400, beyond_horizon: REFUSE, policy_owner: DBT-003, basis: "SCD2 from observation logs; small; rebuilt whole-scope (ALL partitions)."}
  PY_OUTPUT:        {retention_days: 400, rebuild_horizon_days: 7, beyond_horizon: CARRY_FORWARD, policy_owner: ORC-103, basis: "Reproducible only while the pinned input publication's revisions are retained (7-day rollback window); older outputs are kept as published."}
  QUALITY_INTERNAL: {retention_days: 400, rebuild_horizon_days: 400, beyond_horizon: REFUSE, policy_owner: FIN-009, basis: "Reconciliation and quality datasets follow the financial horizon of their inputs."}

# ---------------------------------------------------------------------------------------------
# Revisioned datasets
# ---------------------------------------------------------------------------------------------
datasets:

  # ---------------- Ledger: charges (FIN) ----------------
  - dataset_id: fct_charge
    owner_task: FIN-001
    domain: FIN
    layer: ledger
    materialization: revisioned
    physical: {schema: ledger, table: fct_charge_r}
    grain: "One active charge bucket per fine bucket_key (D-12, FIN §3.1) per usage_date; ACCOUNT scope rows carry account_id, ORGANIZATION scope rows (org fees, unresolved accounts) carry account_id NULL."
    unique_key: [tenant_id, bucket_key]
    tenant_key: tenant_id
    partition: {scope: ACCOUNT_OR_ORGANIZATION, granularity: DAY, time_column: usage_date}
    measure_role: CHARGE
    retention_class: FINANCIAL
    rap: {policy: security.rap_account_scoped, args: [tenant_id, organization_id, account_id]}
    publication_phase: CORE
    companions: [{table: lineage.charge_source, owner_task: DBT-006}]
    upstream:
      - {dataset_id: fct_rate, rule: org_to_accounts}
      - {dataset_id: dim_account_membership, rule: scope_all_open, note: "membership changes move charges between organizations/accounts"}
    sources:
      - {source_id: OU_USAGE_IN_CURRENCY_DAILY, rule: org_day_fanout}
      - {source_id: AU_METERING_DAILY_HISTORY, rule: window_days}
      - {source_id: AU_METERING_HISTORY, rule: window_hours_to_day, overlap_hours: 24}
      - {source_id: OU_STORAGE_DAILY_HISTORY, rule: org_day_fanout}
      - {source_id: AU_DATA_TRANSFER_HISTORY, rule: window_days}
    config:
      - {config_kind: RATE_CARD, rule: config_version_tenant_open}
      - {config_kind: BILLING_REFERENCE, rule: config_version_tenant_open}
    consumers: [srv_charge_daily, int_alloc_unit, fct_reconciliation, bridge_warehouse_hour, "FIN-009", "FIN-010", "API-005 explain", "LCH-105 spend bands"]
    release: R1
    notes: "Active rows only (FIN-102-S07); supersession audit in fct_charge_supersession. ledger_<family> models are thin views over this dataset (views section)."

  - dataset_id: fct_charge_supersession
    owner_task: FIN-102
    domain: FIN
    layer: ledger
    materialization: revisioned
    physical: {schema: ledger, table: fct_charge_supersession_r}
    grain: "One row per superseded estimate charge_row_id and the family bucket / UICD snapshot revision that superseded it."
    unique_key: [tenant_id, estimate_charge_row_id]
    tenant_key: tenant_id
    partition: {scope: ACCOUNT_OR_ORGANIZATION, granularity: DAY, time_column: usage_date}
    measure_role: CHARGE
    retention_class: FINANCIAL
    rap: {policy: security.rap_account_scoped, args: [tenant_id, organization_id, account_id]}
    publication_phase: CORE
    upstream:
      - {dataset_id: fct_charge, rule: identity}
    consumers: ["FIN-009 C8 estimate accuracy", "API-005 explain"]
    release: R1

  - dataset_id: fct_rate
    owner_task: FIN-002
    domain: FIN
    layer: ledger
    materialization: revisioned
    physical: {schema: ledger, table: fct_rate_r}
    grain: "One effective rate per (rate_source, full rate key G-FIN-20, effective_date) for an organization."
    unique_key: [tenant_id, organization_id, rate_source, rate_key, effective_date]
    tenant_key: tenant_id
    partition: {scope: ORGANIZATION, granularity: DAY, time_column: effective_date}
    measure_role: MEASUREMENT
    retention_class: FINANCIAL
    rap: {policy: security.rap_account_scoped, args: [tenant_id, organization_id, account_id]}
    publication_phase: CORE
    sources:
      - {source_id: OU_RATE_SHEET_DAILY, rule: window_days}
    config:
      - {config_kind: RATE_CARD, rule: config_version_tenant_open}
    consumers: [fct_charge, "FIN-105 pricing UI (via broker)"]
    release: R1
    notes: "account_id is always NULL in this dataset (organization-level rows); RAP_ACCOUNT_SCOPED then admits only organization-level entitlements."

  - dataset_id: fct_ledger_freshness
