# contract=aws-scp-test-matrix version=1 status=DRAFT owner_task=INF-001 decisions=D-02,D-07,D-23,D-25 last_changed=2026-09-28
# Denied/allowed calls proving each SCP (INF-001-S04 oracle, INF-103-S10, INF-005-S13). Executed from the named
# principal in the named account (DEV unless stated; PROD cases use a PROD test role created for the drill and
# deleted afterwards). `expect: DENY_SCP` means an explicit deny whose message names an SCP
# ("with an explicit deny in a service control policy"); ALLOW means the SCP layer does not block (identity policy
# permitting). Cases tagged verify_live check vendor condition-key behaviour marked TO VERIFY LIVE.
schema_version: 1
cases:
  - {id: SCP-01, scp: bridge-scp-deny-leave-org, principal: "role/bridge-dev-tf-apply", call: "organizations:LeaveOrganization", expect: DENY_SCP}
  - {id: SCP-02, scp: bridge-scp-protect-security-services, principal: "role/bridge-dev-tf-apply", call: "config:StopConfigurationRecorder --configuration-recorder-name default", expect: DENY_SCP}
  - {id: SCP-03, scp: bridge-scp-protect-security-services, principal: "role/bridge-dev-tf-apply", call: "guardduty:UpdateDetector --enable false", expect: DENY_SCP}
  - {id: SCP-04, scp: bridge-scp-protect-security-services, principal: "role/bridge-dev-tf-apply", call: "securityhub:DisableSecurityHub", expect: DENY_SCP}
  - {id: SCP-05, scp: bridge-scp-protect-security-services, principal: "role/bridge-dev-tf-apply", call: "ec2:DeleteFlowLogs (test flow log)", expect: ALLOW}
  - {id: SCP-06, scp: bridge-scp-protect-security-services, principal: "role/bridge-dev-tf-plan", call: "ec2:DeleteFlowLogs --dry-run", expect: DENY_SCP}
