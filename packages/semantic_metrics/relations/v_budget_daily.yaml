# contract=semantic-relation:v_budget_daily version=1 status=DRAFT owner_task=API-001 decisions=D-02,D-05,D-11,D-12 last_changed=2026-09-28
# Serving relation bound by the v1 registry (API-001-S03). Physical view: bridge.serving.serving_budget_daily
# The deployed secure view must expose exactly these columns (API-101-S01 drift check).
id: v_budget_daily
version: 1
status: ACTIVE
release: R1
kind: FACT
description: One row per (budget revision, day). Actuals reuse the explorer metric (no separate budget formula, governance.md); overlapping budgets are never summed (budget_id parameter
  is required).
serving_view: bridge.serving.serving_budget_daily
dataset_id: budget_daily
dbt_model: serving_budget_daily
upstream_owner_tasks: [GOV-001, DBT-006]
grain_keys: [tenant_id, budget_id, budget_revision_id, usage_date]
tenant_column: tenant_id
time: {column: usage_date, type: DATE, grain: DAY, period_semantics: USAGE_DATE}
publication: {pinned: true, pub_from_column: _pub_from, pub_to_column: _pub_to}
policy:
  row_access_policy: RAP_GROUP_SCOPED
  policy_columns: [tenant_id, organization_id, account_id, book_id, group_id]
  readable_by: GROUP_SCOPED_PROFILES
tier: FULL
retention: {days: 400, basis: FIXED, reference: 'D-11 / D-26: canonical financial and execution-level facts 400 days'}
entitlement_dimensions: [organization, account, group_set, group]
currency_column: currency
data_status_column: data_status
required_sources: []
columns:
- {name: tenant_id, type: VARCHAR(36), nullable: false, role: KEY, privacy: INTERNAL, description: 'Tenant (UUIDv7, lowercase). First predicate of every compiled query (pruning); isolation
    is enforced by the row access policy.'}
- {name: usage_date, type: DATE, nullable: false, role: TIME, privacy: INTERNAL}
- {name: budget_id, type: VARCHAR(36), nullable: false, role: KEY, privacy: INTERNAL}
- {name: budget_revision_id, type: VARCHAR(36), nullable: false, role: KEY, privacy: INTERNAL}
- {name: organization_id, type: VARCHAR(36), nullable: true, role: DIMENSION, privacy: INTERNAL}
- {name: account_id, type: VARCHAR(36), nullable: true, role: DIMENSION, privacy: INTERNAL}
- {name: book_id, type: VARCHAR(36), nullable: true, role: DIMENSION, privacy: INTERNAL}
- {name: group_id, type: VARCHAR, nullable: true, role: DIMENSION, privacy: INTERNAL}
- name: scope_metric
  type: VARCHAR(16)
  nullable: false
  role: STATUS
  privacy: INTERNAL
  enum_values: [SPEND, ALLOCATED_SPEND]
- {name: period_start, type: DATE, nullable: false, role: TIME, privacy: INTERNAL}
- {name: period_end, type: DATE, nullable: false, role: TIME, privacy: INTERNAL, description: Exclusive.}
- {name: calendar_policy, type: VARCHAR, nullable: false, role: STATUS, privacy: INTERNAL}
- {name: plan_amount_daily, type: 'NUMBER(38,12)', nullable: false, role: MEASURE, privacy: INTERNAL, description: Budget amount prorated to the day by the declared calendar policy (GOV-001
    formula sheet).}
- {name: actual_amount, type: 'NUMBER(38,12)', nullable: true, role: MEASURE, privacy: INTERNAL, description: spend (or allocated_spend for team/group budgets) in the budget scope for
    the day; NULL for future days.}
- {name: is_complete_day, type: BOOLEAN, nullable: false, role: FLAG, privacy: INTERNAL}
- {name: is_future_day, type: BOOLEAN, nullable: false, role: FLAG, privacy: INTERNAL}
- {name: currency, type: VARCHAR(3), nullable: false, role: DIMENSION, privacy: INTERNAL, description: ISO 4217 currency of the money columns of the row.}
- name: data_status
  type: VARCHAR(12)
  nullable: false
  role: STATUS
  privacy: INTERNAL
  enum_values: [PROVISIONAL, FINAL, RECONCILED]
- {name: _pub_from, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: First pub_seq at which the row's revision is published (ADR-014 §7).}
- {name: _pub_to, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: pub_seq at which the revision was superseded; 9223372036854775807 while current.}
owner_task: API-001
notes: Policy column choice for organization/account budgets (group columns NULL) is owned by GOV-001 with SEC-005 (hand-off K7).
