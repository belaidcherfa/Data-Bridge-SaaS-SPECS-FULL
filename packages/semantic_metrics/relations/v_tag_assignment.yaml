# Serving relation bound by the v1 registry (API-001-S03). Physical view: bridge.serving.serving_tag_assignment
# The deployed secure view must expose exactly these columns (API-101-S01 drift check).
id: v_tag_assignment
version: 1
status: ACTIVE
release: R1
kind: FACT
description: Effective-dated tag assignments (native TAG_REFERENCES snapshots, Enterprise-gated, and External Tag Studio rules). Joined as an EXISTS semi-join only.
serving_view: bridge.serving.serving_tag_assignment
dataset_id: tag_assignment
dbt_model: fct_tag_assignment
upstream_owner_tasks: [ALC-001]
grain_keys: [tenant_id, target_kind, target_id, tag_key, valid_from]
tenant_column: tenant_id
time: {column: valid_from, type: DATE, grain: DAY, period_semantics: USAGE_DATE}
publication: {pinned: true, pub_from_column: _pub_from, pub_to_column: _pub_to}
policy:
  row_access_policy: RAP_ACCOUNT_SCOPED
  policy_columns: [tenant_id, organization_id, account_id]
  readable_by: ACCOUNT_SCOPED_PROFILES
tier: FULL
retention: {days: 400, basis: FIXED, reference: 'D-11 / D-26: canonical financial and execution-level facts 400 days'}
entitlement_dimensions: [organization, account]
currency_column: null
data_status_column: null
required_sources: [au.tag_references]
columns:
- {name: tenant_id, type: VARCHAR(36), nullable: false, role: KEY, privacy: INTERNAL, description: 'Tenant (UUIDv7, lowercase). First predicate of every compiled query (pruning); isolation
    is enforced by the row access policy.'}
- name: target_kind
  type: VARCHAR(24)
  nullable: false
  role: KEY
  privacy: INTERNAL
  enum_values: [QUERY, WAREHOUSE_IDLE, WAREHOUSE, DATABASE, STAGE, TABLE, PIPE, HIDDEN_PIPE, STREAMING_CHANNEL, TASK, ALERT, DYNAMIC_TABLE, MATERIALIZED_VIEW, COMPUTE_POOL, SPCS_SERVICE,
    AI_FUNCTION, AI_SEARCH_SERVICE, AI_ANALYST, AI_AGENT, TRANSFER_DIRECTION, REPLICATION_GROUP, LISTING, APPLICATION, ACCOUNT, ORGANIZATION, RESIDUAL]
- {name: target_id, type: VARCHAR, nullable: false, role: KEY, privacy: INTERNAL}
- {name: organization_id, type: VARCHAR(36), nullable: false, role: DIMENSION, privacy: INTERNAL, description: Internal organization id (DBT-003 durable id).}
- {name: account_id, type: VARCHAR(36), nullable: false, role: DIMENSION, privacy: INTERNAL, description: Internal account id (DBT-003 durable id).}
- {name: tag_key, type: VARCHAR, nullable: false, role: DIMENSION, privacy: CUSTOMER_METADATA}
- {name: tag_value, type: VARCHAR, nullable: false, role: DIMENSION, privacy: CUSTOMER_METADATA}
- {name: tag_pair, type: VARCHAR, nullable: false, role: DIMENSION, privacy: CUSTOMER_METADATA, description: '''<key>=<value>'' (dimension `tag`).'}
- name: tag_source
  type: VARCHAR(16)
  nullable: false
  role: STATUS
  privacy: INTERNAL
  enum_values: [NATIVE, EXTERNAL_RULE]
- {name: valid_from, type: DATE, nullable: false, role: TIME, privacy: INTERNAL}
- {name: valid_to, type: DATE, nullable: false, role: TIME, privacy: INTERNAL, description: Exclusive; 9999-12-31 while current.}
- {name: _pub_from, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: First pub_seq at which the row's revision is published (ADR-014 §7).}
- {name: _pub_to, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: pub_seq at which the revision was superseded; 9223372036854775807 while current.}
owner_task: API-001
