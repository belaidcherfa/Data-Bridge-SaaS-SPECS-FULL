notes: 'PERCENTILE_CONT(0.95) over individual TOTAL_ELAPSED_TIME values (compile + queue + execution), never an average of daily percentiles. Oracle: {100 × 1 s, 5 × 100 s} → position
  0.95 × 104 = 98.8 → 1 s (not 50.5 s). Beyond hot_days: APPROX_PERCENTILE_ESTIMATE(APPROX_PERCENTILE_COMBINE(elapsed_tdigest), 0.95) labelled ≈.'
