# contract=semantic-relation:v_allocation_daily version=1 status=DRAFT owner_task=API-001 decisions=D-02,D-05,D-11,D-12 last_changed=2026-09-28
# Serving relation bound by the v1 registry (API-001-S03). Physical view: bridge.serving.srv_allocation_restricted
# The deployed secure view must expose exactly these columns (API-101-S01 drift check).
id: v_allocation_daily
version: 1
status: ACTIVE
release: R1
kind: FACT
description: 'Restricted allocation projection: no source amount, weight, driver or pool total (ALC G-ALC). Book-wide profiles also read it; group-restricted profiles see only entitled
  groups. The group hierarchy rollup uses jp_allocation_group_ancestor.'
serving_view: bridge.serving.srv_allocation_restricted
dataset_id: allocation_restricted_daily
dbt_model: srv_allocation_restricted
upstream_owner_tasks: [ALC-005, ALC-101, ALC-102]
grain_keys: [tenant_id, allocation_row_key]
tenant_column: tenant_id
time: {column: usage_date, type: DATE, grain: DAY, period_semantics: USAGE_DATE}
publication: {pinned: true, pub_from_column: _pub_from, pub_to_column: _pub_to}
policy:
  row_access_policy: RAP_GROUP_SCOPED
  policy_columns: [tenant_id, organization_id, account_id, book_id, target_group_id]
  readable_by: GROUP_SCOPED_PROFILES
tier: FULL
retention: {days: 400, basis: FIXED, reference: 'D-11 / D-26: canonical financial and execution-level facts 400 days'}
entitlement_dimensions: [organization, account, group_set, group]
currency_column: currency
data_status_column: data_status
required_sources: []
columns:
- {name: tenant_id, type: VARCHAR(36), nullable: false, role: KEY, privacy: INTERNAL, description: 'Tenant (UUIDv7, lowercase). First predicate of every compiled query (pruning); isolation
    is enforced by the row access policy.'}
- {name: usage_date, type: DATE, nullable: false, role: TIME, privacy: INTERNAL}
- {name: allocation_row_key, type: VARCHAR(64), nullable: false, role: KEY, privacy: INTERNAL}
- {name: book_id, type: VARCHAR(36), nullable: false, role: DIMENSION, privacy: INTERNAL, description: 'Allocation book = group set id (ALC: book_id = group_set_id).'}
- {name: target_group_id, type: VARCHAR, nullable: false, role: DIMENSION, privacy: INTERNAL, description: Usage group id or sentinel '__UNALLOCATED__' / '__SHARED__'.}
- {name: organization_id, type: VARCHAR(36), nullable: false, role: DIMENSION, privacy: INTERNAL, description: Internal organization id (DBT-003 durable id).}
- name: scope_kind
  type: VARCHAR(12)
  nullable: false
  role: DIMENSION
  privacy: INTERNAL
  enum_values: [ACCOUNT, ORGANIZATION]
- {name: account_id, type: VARCHAR(36), nullable: true, role: DIMENSION, privacy: INTERNAL, description: Internal account id; NULL iff scope_kind = ORGANIZATION (D-12).}
- name: service_category
  type: VARCHAR
  nullable: false
  role: DIMENSION
  privacy: INTERNAL
  enum_values: [COMPUTE, CLOUD_SERVICES, STORAGE, SERVERLESS, AI, SPCS, DATA_TRANSFER, REPLICATION, APPLICATIONS_MARKETPLACE, ORGANIZATION, ADJUSTMENT, OTHER]
  description: Deterministic grouping of service_family (dimensions/service_category.yaml).
- name: component_kind
  type: VARCHAR(24)
  nullable: false
  role: DIMENSION
  privacy: INTERNAL
  enum_values: [QUERY_COMPUTE, IDLE, CLOUD_SERVICES, STORAGE, SERVERLESS, AI, SPCS, DATA_TRANSFER, FEE, ADJUSTMENT, OTHER]
- name: method
  type: VARCHAR(24)
  nullable: false
  role: DIMENSION
  privacy: INTERNAL
  enum_values: [DIRECT, RULE, SHARED_PROPORTIONAL, SHARED_EVEN, SHARED_FIXED, DRIVER_BASED, MANUAL_TRANSFER, PLATFORM_DEFAULT, UNALLOCATED]
- {name: policy_version, type: VARCHAR, nullable: false, role: PROVENANCE, privacy: INTERNAL}
- {name: allocation_publication_id, type: VARCHAR, nullable: false, role: PROVENANCE, privacy: INTERNAL}
- {name: is_unallocated, type: BOOLEAN, nullable: false, role: FLAG, privacy: INTERNAL}
- {name: is_shared, type: BOOLEAN, nullable: false, role: FLAG, privacy: INTERNAL}
- {name: allocated_amount, type: 'NUMBER(38,12)', nullable: true, role: MEASURE, privacy: INTERNAL}
- {name: currency, type: VARCHAR(3), nullable: false, role: DIMENSION, privacy: INTERNAL, description: ISO 4217 currency of the money columns of the row.}
- name: data_status
  type: VARCHAR(12)
  nullable: false
  role: STATUS
  privacy: INTERNAL
  enum_values: [PROVISIONAL, FINAL, RECONCILED]
- {name: explain_ref, type: VARCHAR(64), nullable: false, role: PROVENANCE, privacy: INTERNAL, description: Opaque reference for Explain STATEMENT_LINE/ALLOCATION_RULE resolvers; carries
    no weight or denominator.}
- {name: _pub_from, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: First pub_seq at which the row's revision is published (ADR-014 §7).}
- {name: _pub_to, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: pub_seq at which the revision was superseded; 9223372036854775807 while current.}
owner_task: API-001
