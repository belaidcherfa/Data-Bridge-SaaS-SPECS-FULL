# ---------------------------------------------------------------------------------------------------
# Delegation (Appendix C.3; SEC-004-S08). Evaluated on invitation create/accept and on grant replacement.
# ---------------------------------------------------------------------------------------------------
delegation:
  rules:
    - id: DLG-1
      rule: "The actor holds member.manage (member.invite for invitations) over a scope that subsumes the target grant's scope (SEC-101 subsumes over canonical atoms)."
      error: AUTHZ_DELEGATION_EXCEEDED
    - id: DLG-2
      rule: "Every DEFAULT capability of the target role and every extra capability is contained in the actor's own effective capability set, excluding owner-only capabilities."
      error: AUTHZ_DELEGATION_EXCEEDED
    - id: DLG-3
      rule: "A Team Admin may assign only roles listed in role_ceilings.TEAM_ADMIN, and only for members of teams it administers; the target scope must also be <= the Team Admin's member.manage scope."
      error: AUTHZ_DELEGATION_EXCEEDED
    - id: DLG-4
      rule: "Nobody creates or modifies grants of their own membership (identity.role_grant.granted_by_membership_id <> membership_id)."
      error: AUTHZ_SELF_GRANT_FORBIDDEN
    - id: DLG-5
      rule: "Removing, suspending or demoting the last ACTIVE ORGANIZATION_OWNER membership is refused; serialized by SELECT ... FOR UPDATE on all ACTIVE owner memberships of the tenant."
      error: TENANT_LAST_OWNER
    - id: DLG-6
      rule: "Extra capabilities must be GRANTABLE for the target role; VISIBILITY extras (sql_text.read_full) change the profile and require step-up."
      error: AUTHZ_CAPABILITY_NOT_GRANTABLE
    - id: DLG-7
      rule: "Only an ORGANIZATION_OWNER grants ORGANIZATION_OWNER (via invitation by an owner or tenant.ownership.transfer); ORGANIZATION_ADMIN may grant ORGANIZATION_ADMIN and below."
      error: AUTHZ_DELEGATION_EXCEEDED
  owner_only_capabilities: [tenant.ownership.transfer, subscription.manage, sso.approve]
  role_ceilings:
    ORGANIZATION_OWNER: [ORGANIZATION_OWNER, ORGANIZATION_ADMIN, FINOPS_ADMIN, SNOWFLAKE_ADMIN, TEAM_ADMIN, ANALYST, VIEWER, AUDITOR]
    ORGANIZATION_ADMIN: [ORGANIZATION_ADMIN, FINOPS_ADMIN, SNOWFLAKE_ADMIN, TEAM_ADMIN, ANALYST, VIEWER, AUDITOR]
    TEAM_ADMIN: [ANALYST, VIEWER]
  step_up_for_target_roles: [ORGANIZATION_OWNER, ORGANIZATION_ADMIN, FINOPS_ADMIN]
  sso_jit_default: {role: VIEWER, scope: {grammar_version: 1, clauses: []}}   # JIT members see nothing until granted (SEC-003-S08)
  bootstrap_owner: {role: ORGANIZATION_OWNER, scope: {grammar_version: 1, clauses: [{org: "*", account: "*", group: "*", include_shared: true, include_unallocated: true}]}}

# ---------------------------------------------------------------------------------------------------
# Synthetic SUPPORT memberships (SEC-104-S04; RECONCILIATION C-15). Read-only, sanitized SQL, pseudonymous
# identities; banner header X-Bridge-Support-Session; every request audited (support.access.used).
# ---------------------------------------------------------------------------------------------------
support_scopes:
  health_read:
    role: SUPPORT_READ_ONLY
    capabilities: [tenant.read, data_health.read, connection.read, config_publication.read, onboarding.read]
    data_scope: none          # no analytical rows; profile is not provisioned
  analytics_read:
    role: SUPPORT_READ_ONLY
    capabilities: [tenant.read, data_health.read, connection.read, config_publication.read, onboarding.read,
                   analytics.read, query.read, sql_text.read_sanitized, explain.read]
    data_scope: approved      # data_scope_json on the grant, <= approver scope
  never: [identity.resolve, sql_text.read_full, export.data, export.bulk, analysis_job.run]
  max_duration_minutes: 480
  default_duration_minutes: 240

# ---------------------------------------------------------------------------------------------------
# Machine clients (API-006, R2): Cognito resource-server scopes express capabilities only; tenant and data scope
# come from identity.machine_client. Allowlist of capabilities a machine client may hold.
# ---------------------------------------------------------------------------------------------------
machine_client_allowlist: [analytics.read, query.read, explain.read, analysis_job.run, analysis_job.read, export.data]
cognito_scope_mapping:
  analytics.read: bridge-api/analytics.read
  query.read: bridge-api/query.read
  explain.read: bridge-api/explain.read
  analysis_job.run: bridge-api/jobs.write
  analysis_job.read: bridge-api/jobs.read
  export.data: bridge-api/exports.read

# ---------------------------------------------------------------------------------------------------
# Operator roles (CTL-102-S02 operator role catalog; IAM Identity Center OIDC + hardware MFA; never tenant roles).
# ---------------------------------------------------------------------------------------------------
operator_roles:
  ops_viewer:
    capabilities: [ops.tenant.read]
  ops_provisioner:
    capabilities: [ops.tenant.read, ops.tenant.provision, ops.tenant.suspend, ops.tenant.offboard, ops.config.redrive]
  finance_operator:
    capabilities: [ops.tenant.read, ops.finance.payment.record, ops.finance.payment.correct, ops.finance.subscription.transition,
                   ops.finance.entitlement.override, ops.tenant.suspend]
  support_agent:
    capabilities: [ops.tenant.read, ops.support.request]
  incident_responder:
    capabilities: [ops.tenant.read, ops.tenant.suspend, ops.incident.respond, ops.outbox.redrive, ops.outbox.discard, ops.recovery.execute]
  rules:
    - "Operators authenticate on the internal ops plane only (IAM Identity Center OIDC for the console, SigV4 for bridge-admin); Cognito customer sessions are rejected there."
    - "An operator never holds a tenant membership except a synthetic SUPPORT membership materialized by a customer-approved support grant."
    - "Two-operator actions: see capabilities.yaml#operator_approval_policies; the approving operator must differ from the requesting operator."

# ---------------------------------------------------------------------------------------------------
# Separation-of-duties summary (derived; the normative rules are approval_policies in capabilities.yaml).
# ---------------------------------------------------------------------------------------------------
separation_of_duties:
  - "Approver != requester and != last editor of the approved revision, for every approval action, unless self_approval permits it and the approval is flagged self_approved (surfaced on statements and audit)."
  - "Self-approval under SINGLE_ELIGIBLE_APPROVER_FLAGGED is allowed only when, at request time, no other ACTIVE member holds a checker capability over the object's full scope; adding one disables self-approval for new requests."
  - "The checker must hold the checker capability over the object's full scope at approval AND at execution; losing it voids the approval (APPROVER_LOST_CAPABILITY)."
  - "Owner and Admin role grants, ownership transfer, SSO enforcement, FULL privacy mode, erasure, close and restatement require step-up (auth_time <= 600 s)."
  - "Finance operators (ops plane) can never approve their own payment corrections; tenant Owners can never mark invoices paid (LCH-001-S13)."
