  - {key: pi01.min_files, type: INTEGER, default: 100, min: 1, max: 1000000, tenant_overridable: false, owner_task: INS-104, description: "R2."}
  - {key: pi02.min_ops_per_hour, type: INTEGER, default: 60, min: 1, max: 100000, tenant_overridable: false, owner_task: INS-104, description: "R2."}
  - {key: pi04.rate_tolerance, type: DECIMAL, default: "0.05", min: "0.01", max: "0.50", tenant_overridable: false, owner_task: INS-104, description: "R2 reconciliation check tolerance."}
  - {key: pi04.credits_per_gb, type: DECIMAL, default: "0.0037", min: "0", max: "1", tenant_overridable: false, owner_task: INS-104, description: "Snowpipe per-GB rate since 2025-12-08 (VERIFIED in INS backlog G-INS-03; rate sheet wins when present)."}
