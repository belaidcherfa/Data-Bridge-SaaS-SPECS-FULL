  - {key: ai07.rise, type: DECIMAL, default: "0.25", min: "0.05", max: "10", tenant_overridable: false, owner_task: INS-005, description: "R2 gated."}
  - {key: sp01.cpu, type: DECIMAL, default: "0.20", min: "0.01", max: "0.90", tenant_overridable: false, owner_task: INS-005, description: "Gated."}
