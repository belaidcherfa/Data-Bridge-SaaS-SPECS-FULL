# contract=semantic-relation:v_dim_resource version=1 status=DRAFT owner_task=API-001 decisions=D-02,D-05,D-11,D-12 last_changed=2026-09-28
# Serving relation bound by the v1 registry (API-001-S03). Physical view: bridge.serving.serving_dim_resource
# The deployed secure view must expose exactly these columns (API-101-S01 drift check).
id: v_dim_resource
version: 1
status: ACTIVE
release: R1
kind: DICTIONARY
description: Labels and attributes for warehouses, databases, schemas, pipes, tasks, dynamic tables, compute pools, SPCS services and applications.
serving_view: bridge.serving.serving_dim_resource
dataset_id: dim_resource
dbt_model: dim_resource
upstream_owner_tasks: [DBT-003]
grain_keys: [tenant_id, resource_kind, resource_id]
tenant_column: tenant_id
time: {column: null, type: NONE, grain: NONE}
publication: {pinned: true, pub_from_column: _pub_from, pub_to_column: _pub_to}
policy:
  row_access_policy: RAP_ACCOUNT_SCOPED
  policy_columns: [tenant_id, organization_id, account_id]
  readable_by: ACCOUNT_SCOPED_PROFILES
tier: FULL
retention: {days: null, basis: FIXED, reference: Effective-dated resource history (DBT-003); current row per resource}
entitlement_dimensions: [organization, account]
currency_column: null
data_status_column: null
required_sources: []
columns:
- {name: tenant_id, type: VARCHAR(36), nullable: false, role: KEY, privacy: INTERNAL, description: 'Tenant (UUIDv7, lowercase). First predicate of every compiled query (pruning); isolation
    is enforced by the row access policy.'}
- name: resource_kind
  type: VARCHAR(24)
  nullable: false
  role: KEY
  privacy: INTERNAL
  enum_values: [WAREHOUSE, DATABASE, SCHEMA, STAGE, TABLE, PIPE, TASK, ALERT, DYNAMIC_TABLE, MATERIALIZED_VIEW, COMPUTE_POOL, SPCS_SERVICE, APPLICATION, LISTING]
- {name: resource_id, type: VARCHAR(36), nullable: false, role: KEY, privacy: INTERNAL, description: Internal durable UUID (DBT-003).}
- {name: organization_id, type: VARCHAR(36), nullable: false, role: DIMENSION, privacy: INTERNAL, description: Internal organization id (DBT-003 durable id).}
- {name: account_id, type: VARCHAR(36), nullable: false, role: DIMENSION, privacy: INTERNAL, description: Internal account id (DBT-003 durable id).}
- {name: resource_name, type: VARCHAR, nullable: false, role: LABEL, privacy: CUSTOMER_METADATA}
- {name: qualified_name, type: VARCHAR, nullable: false, role: LABEL, privacy: CUSTOMER_METADATA}
- {name: parent_resource_id, type: VARCHAR(36), nullable: true, role: DIMENSION, privacy: INTERNAL, description: 'Database of a schema, pool of a service, …'}
- {name: snowflake_object_id, type: VARCHAR, nullable: true, role: PROVENANCE, privacy: INTERNAL, description: Native numeric id as text.}
- name: warehouse_type
  type: VARCHAR(12)
  nullable: true
  role: DIMENSION
  privacy: INTERNAL
  enum_values: [CLASSIC, ADAPTIVE]
- {name: warehouse_size, type: VARCHAR, nullable: true, role: DIMENSION, privacy: INTERNAL}
- {name: is_dropped, type: BOOLEAN, nullable: false, role: FLAG, privacy: INTERNAL}
- {name: first_observed_at, type: TIMESTAMP_NTZ(9), nullable: false, role: PROVENANCE, privacy: INTERNAL}
- {name: dropped_at, type: TIMESTAMP_NTZ(9), nullable: true, role: PROVENANCE, privacy: INTERNAL}
- {name: _pub_from, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: First pub_seq at which the row's revision is published (ADR-014 §7).}
- {name: _pub_to, type: 'NUMBER(38,0)', nullable: false, role: PUBLICATION, privacy: INTERNAL, description: pub_seq at which the revision was superseded; 9223372036854775807 while current.}
owner_task: API-001
