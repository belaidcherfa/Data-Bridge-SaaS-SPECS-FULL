  - name: ledger.bridge_charge_attribution
    owner_task: FIN-103
    kind: UNION_REGISTRY
    members: [bridge_warehouse_hour, bridge_warehouse_query_idle, bridge_adaptive_query_hour, bridge_cloud_services, bridge_storage_database, bridge_storage_table, bridge_pipe, bridge_streaming, bridge_serverless_task, bridge_serverless_alert, bridge_auto_clustering, bridge_search_optimization, bridge_materialized_view, bridge_qas_warehouse, bridge_qas_query, bridge_ai_services, bridge_spcs_pool, bridge_spcs_service, bridge_native_app_consumption, bridge_data_transfer, bridge_replication]
    notes: "Explicit include registry (transformation.md). Row contract data/contracts/ledger/bridge_charge_attribution.schema.json (FIN-001-S04). Inside builds it is read through upstream_for_workset per member; readers never query it directly."
  - name: ledger.ledger_family_views
    owner_task: FIN-102
    kind: PROJECTION
    members: [fct_charge]
    notes: "ledger_<family> thin filters over fct_charge for PRD traceability (FIN-102-S07); one view per service_family."
  - name: marts.fct_ins_query_family_day
    owner_task: INS-003
    kind: PROJECTION
    members: [fct_query_family_daily]
    notes: "RECONCILIATION U-17: INS measures are columns of fct_query_family_daily."
  - name: staging.stg_*
    owner_task: DBT-002
    kind: STAGING_DEDUP
    members: []
    notes: "Staging models are views over accepted RAW through accepted_source() (accepted_seq <= BUILD.snapshot_seq), dedup_mode NATURAL_KEY or WINDOW_SNAPSHOT; never tables."

# ---------------------------------------------------------------------------------------------
# Insert-only tables written outside dbt builds that analytical builds or gates consume.
# ---------------------------------------------------------------------------------------------
external_tables:
  - name: control.accepted_batches
    owner_task: ING-007
    write_path: INGEST_ACCEPTOR
    versioning: INSERT_ONLY_EVENTS
    consumed_by: ["accepted_source()", "ORC-101 planner (accepted_seq)"]
    notes: "Requires accepted_seq NUMBER(38,0) assigned by the single-writer acceptor in the same INSERT (ORC-101-S01; hand-off K4 H-01)."
  - name: config.config_version
    owner_task: CTL-005
    write_path: CONFIG_PUBLISHER
    versioning: INSERT_ONLY_VERSIONED
    consumed_by: ["pinned_config()", "BUILD_CONFIG_PIN planner"]
    notes: "Header/commit marker of every config version (D-04). Kind tables per data/dbt/models/staging/config/_sources.yml."
  - name: ledger.fct_billing_reference
    owner_task: FIN-101
    write_path: CONFIG_PUBLISHER
    versioning: INSERT_ONLY_VERSIONED
    consumed_by: [fct_reconciliation]
    notes: "Approved billing reference versions (reference_id, version) published by the D-04 publisher."
  - name: ledger.fct_period_close
    owner_task: FIN-010
    write_path: CONFIG_PUBLISHER
    versioning: INSERT_ONLY_VERSIONED
    consumed_by: ["tenant_all_open / scope_all_open open-period evaluation", "PIN (STATEMENT holders)"]
    notes: "Close records; a CLOSED period is excluded from config-change expansion."
  - name: allocation.fct_chargeback_statement_line
    owner_task: ALC-008
    write_path: STATEMENT_ISSUER
    versioning: INSERT_ONLY_EVENTS
    consumed_by: ["ALC-008 statements", "RPT-002"]
    notes: "Immutable statement lines pinned to a pub_seq; not a revisioned dataset."
  - name: marts.fct_monitor_observation
    owner_task: GOV-004
    write_path: MONITOR_EVALUATOR
    versioning: INSERT_ONLY_EVENTS
    consumed_by: ["GOV-004 tracker"]
    notes: "Insert-only observations keyed per G-GOV-01 with input publication; not in the publication map."
  - name: quality.check_result
    owner_task: DBT-005
    write_path: QUALITY_WRITER
    versioning: INSERT_ONLY_EVENTS
    consumed_by: ["PUBLICATION.PREPARE_CANDIDATES gate (ORC-005-S03)"]
    notes: "Single check-result store keyed by candidate revision (RECONCILIATION U-19). Row contract in data/contracts/checks.yaml; DDL in the QUALITY block (hand-off K4 H-05)."
