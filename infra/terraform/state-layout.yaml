# contract=terraform-state-layout version=1 status=DRAFT owner_task=INF-001 decisions=D-25 last_changed=2026-09-28
# Terraform state, stacks and cross-stack wiring (INF-001-S08/S09, INF-102). Validated by
# infra/terraform/state-layout.schema.json; prose in infra/terraform/STATE_LAYOUT.md.
schema_version: 1

terraform:
  required_version: ">= 1.11.0, < 2.0.0"            # S3-native locking (use_lockfile) GA in 1.11 (VERIFIED, INF-001-S09)
  providers:
    hashicorp/aws: "~> 6.0"                          # exact version locked in .terraform.lock.hcl (FND-002)
    snowflakedb/snowflake: "~> 2.21.0"               # Stable resources only (docs/development/snowflake-iac.md)
  lock_file_committed: true                          # .terraform.lock.hcl per stack, multi-platform hashes (linux_arm64, linux_amd64, darwin_arm64)

backend:
  type: s3
  bucket_pattern: "bridge-tfstate-{name}-{aws_account_id}-euw1"   # one bucket per AWS account
  key_pattern: "{stack}/terraform.tfstate"
  lock: {use_lockfile: true, lock_object: "{stack}/terraform.tfstate.tflock", dynamodb_table: null}
  region: eu-west-1
  encrypt: true
  kms_key_alias_pattern: "alias/bridge-tfstate-{name}"
  backend_config_path: "infra/terraform/stacks/{stack}/backend/{name}.hcl"   # generated by tools/tf/tf.sh from the manifest; never hand-edited
  bucket_policy:
    versioning: true
    sse: aws:kms
    bucket_key_enabled: true
    public_access_block: all
    deny_insecure_transport: true
    object_ownership: BucketOwnerEnforced
    noncurrent_version_expiration_days: 90
    abort_incomplete_multipart_days: 1
    principal_allowlist:                             # every other principal is explicitly denied s3:* on the bucket
      read_write: ["role/bridge-{name}-tf-apply", "role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_BridgeAdmin_*", "role/bridge-break-glass"]
      read_only: ["role/bridge-{name}-tf-plan", "role/bridge-{name}-tf-drift"]
  bootstrap: "Stack 00-bootstrap is applied once with local state by BridgeAdmin, then `terraform init -migrate-state` moves its own state into the bucket; the local file is deleted (INF-001-S08). Never delete state to clear a lock; `force-unlock` only with an incident ID (INF-001-S11)."

cross_stack_outputs:
  mechanism: ssm_parameter_store                     # no terraform_remote_state (it would grant state read to consumers)
  name_pattern: "/bridge/{env}/{stack}/{key}"
  type: String                                       # never SecureString: outputs are non-secret by construction
  writer: producing stack only (aws_ssm_parameter)
  reader: consuming stack via data "aws_ssm_parameter"

guards:                                              # INF-001-S09 / S10
  allowed_account_ids: "provider aws { allowed_account_ids = [<manifest aws_account_id>] }"
  region_precondition: "check block: data.aws_region.current.name == manifest.region"
  wrapper: "tools/tf/tf.sh compares `aws sts get-caller-identity` with infra/environments/<name>.json before `terraform init`; exits 3 on mismatch"
  target_refusal: "`-target` refused on prod unless BREAKGLASS=1 and INCIDENT_ID set"
  placeholders: "tools/tf/validate_env.py refuses REQUIRED_INPUT/GENERATED fields needed by the stack"
  sensitive_state_scan: "tools/tf/scan_sensitive.py fails on random_password, aws_rds_cluster.master_password, aws_elasticache_user.passwords (INF-102-S06)"

accounts:                                            # which stacks run where (mirrors infra/environments/*.json#stacks)
  management: ["00-bootstrap", "org"]
  security: ["00-bootstrap", "10-baseline"]
  log-archive: ["00-bootstrap", "10-baseline"]
  shared-services: ["00-bootstrap", "10-baseline", "shared"]
  dev: ["00-bootstrap", "10-baseline", "20-network", "30-data", "40-databases", "50-compute", "60-edge", "70-snowflake", "80-observability"]
  staging: ["00-bootstrap", "10-baseline", "20-network", "30-data", "40-databases", "50-compute", "60-edge", "70-snowflake", "80-observability", "test-estate"]
  prod: ["00-bootstrap", "10-baseline", "20-network", "30-data", "40-databases", "50-compute", "60-edge", "70-snowflake", "80-observability"]

stacks:
  - id: 00-bootstrap
    owner_task: INF-001-S08
    contents: [state KMS key, state bucket and policy]
    depends_on: []
    applied_by: human (BridgeAdmin, once)
    outputs: []
  - id: org
    owner_task: INF-001-S03..S07
    contents: [OUs, accounts, SCPs and attachments, tag policy, delegated administrators, Identity Center permission sets, organization CloudTrail, CUR 2.0 export (INF-105-S05), AWS Budgets for organization accounts]
    depends_on: [00-bootstrap]
    applied_by: human (BridgeAdmin; human-only gate)
    outputs: [org/organization_id, org/cloudtrail_bucket_arn]
  - id: 10-baseline
    owner_task: INF-001-S07, INF-102-S01/S02, INF-007-S09, INF-105-S02..S04
    contents: [GitHub OIDC provider, CI roles (tf-plan, tf-apply, tf-drift, deploy, build, sf-migrator, sf-security-deployer, snowflake-iac, dbt-ci), GuardDuty, Security Hub, Config recorder (ENI excluded), Access Analyzer, EBS default encryption, account public-access block, break-glass role, AWS Budget and anomaly monitor, cost-allocation tags, alarm SNS topics (eu-west-1 and us-east-1)]
    depends_on: [00-bootstrap]
    applied_by: CI (bridge-{env}-tf-apply, saved plan)
    outputs: [baseline/alarm_topic_arn, baseline/alarm_topic_arn_use1, baseline/github_oidc_provider_arn]
  - id: shared
    owner_task: INF-005-S02, INF-007-S04, INF-006-S01, INF-007-S12
    contents: [ECR repositories (immutable tags, scan on push), cosign KMS key alias/bridge-image-signing, apex Route 53 zone and delegations, bridge-shared-releases bucket (Object Lock governance 400 d)]
    depends_on: [10-baseline]
    applied_by: CI (bridge-shared-services-tf-apply)
    outputs: [shared/ecr_registry, shared/signing_key_arn, shared/apex_zone_id]
  - id: 20-network
    owner_task: INF-002
    contents: [VPC, subnets, route tables, NAT gateways + EIPs (prevent_destroy), S3 gateway endpoint + policy, interface endpoints, security groups (infra/network/sg-matrix.yaml), DNS Firewall, flow logs to S3, in-VPC CI runners, VPC Lattice service network]
    depends_on: [10-baseline]
    applied_by: CI
    outputs: [network/vpc_id, network/app_subnet_ids, network/data_subnet_ids, network/sg/<name>, network/egress_ips, network/lattice_service_network_arn]
  - id: 30-data
    owner_task: INF-003
    contents: [KMS keys per purpose, buckets (infra/storage/catalog.yaml), SNS landing-events, SQS queues + DLQs, alarms]
    depends_on: [10-baseline]
    applied_by: CI
    outputs: [data/bucket/<name>, data/kms/<purpose>, data/queue/<name>, data/topic/landing_events]
  - id: 40-databases
    owner_task: INF-004
    contents: [Aurora PostgreSQL cluster (manage_master_user_password), parameter groups, Valkey replication group / serverless, Dagster secret + rotation Lambda, DB alarms]
    depends_on: [20-network, 30-data]
    applied_by: CI
    outputs: [databases/aurora_writer_endpoint, databases/aurora_cluster_resource_id, databases/valkey_endpoint]
  - id: 50-compute
    owner_task: INF-005, INF-103, INF-007
    contents: [ECS cluster, task/execution roles and policies (infra/iam/), permission boundaries (created by BridgeAdmin gate), task definitions and services from infra/services.yaml, Service Connect namespace, broker Lattice service, autoscaling, deploy alarms]
    depends_on: [20-network, 30-data, 40-databases]
    applied_by: CI
    outputs: [compute/cluster_arn, compute/role/<service>, compute/boundary/conn, compute/boundary/srv]
  - id: 60-edge
    owner_task: INF-006
    contents: [environment DNS zone, ACM certificates (eu-west-1 + us-east-1), internal ALB, SPA bucket + OAC, CloudFront with VPC origin, WAF (us-east-1), SES identity and configuration set, Cognito custom-domain prerequisites, ops-bastion task and SSM document]
    depends_on: [20-network, 30-data, 50-compute]
    applied_by: CI
    outputs: [edge/cloudfront_distribution_id, edge/app_hostname, edge/auth_certificate_arn_use1, edge/ses_configuration_set]
  - id: 70-snowflake
    owner_task: INF-008, FND-101
    contents: [SAML2 security integration, human PERSON users (DEV developers, named administrators), network rules/policies (env EIPs) and their attachments, storage integration + external stage for landing (two-phase with 30-data), e-mail notification integration, per-developer sandboxes (DEV)]
    depends_on: [20-network, 30-data]
    applied_by: CI on the in-VPC runner as SVC_IAC (WIF); Snowflake SQL objects come from infra/snowflake/migrations (INF-104)
    outputs: [snowflake/storage_aws_iam_user_arn, snowflake/storage_aws_external_id]
  - id: 80-observability
    owner_task: INF-005-S14, INF-006-S15, OPS-001
    contents: [dashboards, cross-service alarms, log metric filters (KMS AccessDenied, root login), CloudFront alarms in us-east-1]
    depends_on: [50-compute, 60-edge]
    applied_by: CI
    outputs: []
  - id: test-estate
    owner_task: INF-101-S05
    contents: [Snowflake provider alias per test-estate account, SVC_TESTESTATE_IAC users, BRIDGE_FINOPS install objects (provisional until CON-003), resource monitors]
    depends_on: [20-network]
    applied_by: CI on bridge-staging-vpc runner as bridge-staging-testestate-iac (WIF)
    outputs: []

pull_request_plans:                                  # INF-102-S02/S03
  allowed_envs: [dev, staging]                       # PROD plans run only on main under the `prod` environment
  role: "bridge-{env}-tf-plan (read-only; explicit deny on data-bucket GetObject, secretsmanager:GetSecretValue, non-state kms:Decrypt)"
  artifacts: [binary plan, plan JSON, summary comment]
apply:
  role: "bridge-{env}-tf-apply (no Organizations/SCP/break-glass/boundary-policy edits)"
  rule: "apply the exact saved plan by digest; a plan older than the state serial is refused"
drift:
  schedule: nightly
  command: "terraform plan -detailed-exitcode"
  on_exit_2: "open issue + metric terraform_drift{env,stack}"
protected_resource_types:                            # destroy/replace requires label allow-destroy + second approver (INF-102-S05)
  - aws_rds_cluster
  - aws_s3_bucket
  - aws_kms_key
  - aws_eip
  - aws_route53_zone
  - aws_ecr_repository
  - aws_elasticache_replication_group
  - snowflake_storage_integration_aws
