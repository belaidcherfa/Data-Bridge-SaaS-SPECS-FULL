# contract=authz-capabilities version=1 status=DRAFT owner_task=SEC-004 decisions=D-02,D-10,D-17,D-20,D-22,D-25 last_changed=2026-09-28
# =====================================================================================================
# Capability catalog (SEC-004-S02, SEC-102-S02; SEC backlog Appendix C, G-SEC-04/05). ONE source for:
#   - packages/authz/generated.py (Capability enum), FastAPI `require(cap, scope_of=...)`, x-bridge-capability in OpenAPI
#   - the role x capability matrix (contracts/authz/roles.yaml references ids defined here)
#   - the approval (maker-checker) policy per action (section approval_policies; state machine approval.yaml)
#   - the profile hash inputs (kind VISIBILITY only; contracts/authz/scope-compilation.md)
# Rules:
#   * Every route declares exactly one required capability (CI: tools/ci/check_route_caps.py).
#   * Code uses `id` only. `aliases` are names used in backlogs/other contracts; they resolve to `id` in the
#     generator and are rejected in new code by lint (see contracts/_handoffs/K2.md for the mapping table).
#   * R1 has no custom roles: a grant = one of 8 roles + optional extra capabilities that the role marks GRANTABLE
#     (roles.yaml) + scope clauses (scope.schema.json).
#   * scope_binding SCOPED: the object's scope must be covered by the union of clauses of the actor's grants that
#     carry the capability (SEC-101 subsumes / uncovered_atoms). TENANT: tenant-level, no object scope.
#     OWN: additionally restricted to objects whose owner is the acting membership.
#   * Non-enumeration: a missing READ/VISIBILITY capability or an object outside read scope -> 404 NOT_FOUND;
#     a readable object with a missing MUTATION capability -> 403 FORBIDDEN (SEC-004-S06).
# =====================================================================================================
version: 1
catalog_version: "1.0.0"

kinds:
  VISIBILITY: "Data-visibility capability. Changes the normalized permission profile (profile hash) and is enforced in Snowflake by row-access/masking policies (ADR-005 amendment)."
  READ: "Read of control-plane objects or API-gated analytical features. Checked in the API against PostgreSQL predicates or the semantic registry; not part of the profile hash."
  MUTATION: "State change. Checked in the API (PostgreSQL) against the object scope; never part of the profile hash."

scope_bindings:
  SCOPED: "Object scope must be covered by the union of clauses of grants carrying the capability."
  TENANT: "Tenant-level capability; holding it in any grant is sufficient."
  OWN: "Only objects owned by the acting membership (owner_membership_id = actor), within SCOPED coverage."

enforcement_points:
  SNOWFLAKE_POLICY: "Row access / masking policy via PROFILE_ENTITLEMENT and PROFILE.SQL_TEXT_ACCESS (SEC-005)."
  API: "FastAPI dependency require() + repository scope predicate (SEC-004-S04/S05)."
  API_REGISTRY: "Semantic registry privacy.capability gating of metrics/columns (API-001, API-104)."
  OPERATOR_PLANE: "Internal ops API / console (CTL-102); operator identities only, never tenant roles."

capabilities:
  # ---------------------------------------------------------------- analytics visibility -------------------
  - id: analytics.read
    kind: VISIBILITY
    scope_binding: SCOPED
    enforced_by: [SNOWFLAKE_POLICY, API]
    description: "Read analytical data (serving datasets, metrics, dimension dictionaries) within the grant scope. The clauses of grants carrying this capability ARE the profile atoms."
    profile_input: atoms
    step_up: false
    machine_client: true
    aliases: []
    consumers: [API-002, API-003, API-104, RPT-002, GOV-001, GOV-003, INS-101, ALC-007, UX-003]
    release: R1
  - id: sql_text.read_sanitized
    kind: VISIBILITY
    scope_binding: SCOPED
    enforced_by: [SNOWFLAKE_POLICY]
    description: "Read sanitized query text (SANITIZED privacy mode). Sets profile sql_text >= SANITIZED; masked by MP_SQL_TEXT_SANITIZED otherwise."
    profile_input: sql_text
    step_up: false
    machine_client: false
    aliases: []
    consumers: [API-104, UX-005, WRK-102]
    release: R1
  - id: sql_text.read_full
    kind: VISIBILITY
    scope_binding: SCOPED
    enforced_by: [SNOWFLAKE_POLICY]
    description: "Read full (unsanitized) SQL text. Effective only when the tenant privacy_mode is FULL (approval privacy.mode.full.enable). Sets profile sql_text = FULL (MP_SQL_TEXT_FULL). Granting it requires step-up of the granting admin."
    profile_input: sql_text
    requires_tenant_setting: {privacy_mode: FULL}
    step_up: {on_grant: true}
    machine_client: false
    aliases: [query.sql.read]
    consumers: [SEC-007, API-104]
    release: R1
  - id: finance.org_scope.read
    kind: VISIBILITY
    scope_binding: SCOPED
    enforced_by: [SNOWFLAKE_POLICY]
    derived_from_scope: true
    description: "DERIVED, not grantable: held iff the analytics.read scope contains an atom with account='*' (organization-level atom). Organization-level rows (account NULL, scope_kind ORGANIZATION: support fees, rebates) are visible only then (RAP_ACCOUNT_SCOPED). Listed so FIN-005-S08 can assert it."
    profile_input: atoms
    step_up: false
    machine_client: false
    aliases: []
    consumers: [FIN-005, FIN-001]
    release: R1

