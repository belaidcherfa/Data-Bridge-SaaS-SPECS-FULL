# =====================================================================================================
# Operator-plane capabilities (CTL-102 single ops plane; RECONCILIATION U-05). Never grantable to tenant roles.
# Operator roles map to them in roles.yaml#operator_roles. Used as state-machine actors (tenant.yaml, etc.).
# =====================================================================================================
operator_capabilities:
  - {id: ops.tenant.read, description: "Read tenant status, principal state and health (no customer data).", owner_task: CTL-102}
  - {id: ops.tenant.provision, description: "POST /internal/v1/tenants (step-up, reason, case).", owner_task: CTL-102}
  - {id: ops.tenant.suspend, description: "Suspend/resume a tenant (security kill switch RB-09 or commercial suspension).", owner_task: CTL-102}
  - {id: ops.tenant.offboard, description: "Start OFFBOARDING (second operator approves the OPS-005 deletion request).", owner_task: CTL-102}
  - {id: ops.support.request, description: "Request customer-approved support access for a case (SEC-104).", owner_task: SEC-104}
  - {id: ops.finance.payment.record, description: "Record payment evidence (LCH-001).", owner_task: LCH-001}
  - {id: ops.finance.payment.correct, description: "Correct payment evidence; requires a second finance operator.", owner_task: LCH-001}
  - {id: ops.finance.subscription.transition, description: "Subscription transitions (suspension/cancellation four-eyes, LCH-001-S10).", owner_task: LCH-001}
  - {id: ops.finance.entitlement.override, description: "Entitlement overrides above plan (four-eyes, LCH-101-S08).", owner_task: LCH-101}
  - {id: ops.outbox.redrive, description: "Redrive DEAD outbox events (audited).", owner_task: CTL-004}
  - {id: ops.outbox.discard, description: "Discard DEAD outbox events (two-operator approval).", owner_task: CTL-004}
  - {id: ops.recovery.execute, description: "Execute signed dry-run recovery manifests (second approver, OPS-106-S05).", owner_task: OPS-106}
  - {id: ops.config.redrive, description: "Retry FAILED config publications after CONFIG_VERSION_CONFLICT investigation.", owner_task: CTL-005}
  - {id: ops.incident.respond, description: "Incident response read access and kill-switch execution (RB-09).", owner_task: OPS-106}

# =====================================================================================================
# Approval (maker-checker) policies per action (SEC-102, Appendix C.4). State machine: approval.yaml.
# four_eyes: REQUIRED | REQUIRED_WITH_FLAGGED_SELF_APPROVAL | TARGET_ACCEPTANCE | CUSTOMER_APPROVAL | NONE
# self_approval: NEVER | SINGLE_ELIGIBLE_APPROVER_FLAGGED (allowed only if no other eligible approver exists at
#   request time; recorded self_approved=true, surfaced on statements/audit) | OWNER_WITH_STEP_UP
# tenant_overridable: four_eyes values a tenant may choose via tenant.approval_policy_override (owner acknowledgement);
#   an empty list means the default is fixed.
# Universal invariants: approver != requester and != last editor of the approved revision (unless self-approval is
# permitted and flagged); approver holds a checker capability over the object's FULL scope at approval AND at
# execution; any object revision or content-hash change voids; expiry 7 days; step-up = auth_time <= 600 s.
# =====================================================================================================
approval_policies:
  finance.period.close:
    object_type: financial_period
    maker_capabilities: [finance.period.close.request]
    checker_capabilities: [finance.period.close.approve]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [period_id, object_revision, "content_sha256 = sha256(close manifest: charge/publication/reference/rule/rate/check versions)"]
    covers: [statement.issue]   # a close approval covers statement issue for statements built from the same manifest hash
    expires_after_days: 7
    owner_task: FIN-010
  finance.period.restate:
    object_type: restatement_proposal
    maker_capabilities: [finance.period.restate.request]
    checker_capabilities: [finance.period.restate.approve]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [period_id, proposal_id, object_revision, "content_sha256 = sha256(new pins + difference lines)"]
    expires_after_days: 7
    owner_task: FIN-107
  statement.issue:
    object_type: chargeback_statement
    maker_capabilities: [statement.issue]
    checker_capabilities: [statement.approve]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [statement_id, object_revision, "content_sha256 = statement manifest hash"]
    satisfied_by: [finance.period.close]   # EXECUTED close approval with the same manifest hash
    expires_after_days: 7
    owner_task: ALC-008
  statement.precondition_exception:
    object_type: chargeback_statement
    maker_capabilities: [statement.issue]
    checker_capabilities: [statement.approve]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [statement_id, object_revision, "binding_json.precondition_codes[]"]
    expires_after_days: 7
    owner_task: ALC-008
  finance.pricing.publish:
    object_type: rate_table
    maker_capabilities: [finance.pricing.import]
    checker_capabilities: [finance.pricing.approve]
    four_eyes: REQUIRED
    self_approval: SINGLE_ELIGIBLE_APPROVER_FLAGGED
    tenant_overridable: [REQUIRED, REQUIRED_WITH_FLAGGED_SELF_APPROVAL]
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [rate_table_id, object_revision, content_sha256, "binding_json.evidence_file_sha256"]
    expires_after_days: 7
    owner_task: FIN-105
  finance.reference.activate:
    object_type: billing_reference
    maker_capabilities: [finance.reference.enter]
    checker_capabilities: [finance.reference.approve]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: false, approver: false, max_age_seconds: 600}
    binds: [reference_id, object_revision, "content_sha256 = sha256(file bytes + entered fields)"]
    expires_after_days: 7
    owner_task: FIN-101
  finance.reconciliation.explanation:
    object_type: reconciliation_explanation
    maker_capabilities: [finance.reconciliation.explain]
    checker_capabilities: [finance.reconciliation.approve_explanation]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: false, approver: false, max_age_seconds: 600}
    binds: [explanation_id, object_revision, content_sha256]
    expires_after_days: 7
    owner_task: FIN-009
  rule.publish:
    object_type: ruleset
    maker_capabilities: [tag_rule.edit, allocation_rule.edit, group_set.edit]
    checker_capabilities: [rule.approve]
    four_eyes: REQUIRED
    self_approval: SINGLE_ELIGIBLE_APPROVER_FLAGGED
    tenant_overridable: [REQUIRED, REQUIRED_WITH_FLAGGED_SELF_APPROVAL]
    step_up: {requester: false, approver: false, max_age_seconds: 600}
    binds: [ruleset_id, object_revision, content_sha256, "binding_json.simulation_id", "binding_json.window_fingerprint"]
    legacy_kind: FINANCIAL      # ALC approval_kind FINANCIAL == this action
    expires_after_days: 7
    owner_task: ALC-003
  access.review:
    object_type: ruleset
    maker_capabilities: [tag_rule.edit, allocation_rule.edit, group_set.edit]
    checker_capabilities: [access.review]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: false, approver: true, max_age_seconds: 600}
    binds: [object_id, object_revision, content_sha256, "binding_json.access_impact_digest", "binding_json.group_set_version_hash"]
    legacy_kind: ACCESS         # ALC approval_kind ACCESS == this action; always mandatory (ALC Q1)
    effects_on_execute: ["bump identity.tenant.authz_epoch", "profile recompute for affected members"]
    expires_after_days: 7
    owner_task: ALC-003
  allocation.transfer:
    object_type: allocation_transfer
    maker_capabilities: [allocation_rule.edit]
    checker_capabilities: [rule.approve]
    four_eyes: REQUIRED
    self_approval: SINGLE_ELIGIBLE_APPROVER_FLAGGED
    tenant_overridable: [REQUIRED, REQUIRED_WITH_FLAGGED_SELF_APPROVAL]
    step_up: {requester: false, approver: false, max_age_seconds: 600}
    binds: [transfer_id, object_revision, content_sha256]
    expires_after_days: 7
    owner_task: ALC-005
  allocation.pool_disclosure:
    object_type: allocation_pool
    maker_capabilities: [allocation_rule.edit]
    checker_capabilities: [allocation.pool_disclosure.manage]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: false, approver: true, max_age_seconds: 600}
    binds: [pool_id, object_revision, "binding_json.disclosure = DISCLOSED", "binding_json.consumer_count"]
    effects_on_execute: ["bump identity.tenant.authz_epoch"]
    expires_after_days: 7
    owner_task: ALC-101
  privacy.mode.full.enable:
    object_type: tenant_setting
    maker_capabilities: [privacy.mode.full.enable]
    checker_capabilities: [privacy.mode.full.enable]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [tenant_setting_id, object_revision, "content_sha256 = sha256(target privacy_mode + retention)"]
    effects_on_execute: ["tenant.setting.privacy_mode = FULL", "bump identity.tenant.authz_epoch"]
    expires_after_days: 7
    owner_task: SEC-007
  privacy.erasure:
    object_type: privacy_request
    maker_capabilities: [privacy.erasure.request]
    checker_capabilities: [privacy.erasure.request]
    four_eyes: REQUIRED
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [request_id, object_revision, "content_sha256 = sha256(pseudonym set + preview counts)"]
    expires_after_days: 7
    owner_task: OPS-005
  tenant.deletion:
    object_type: privacy_request
    maker_capabilities: [tenant.offboarding.request]
    checker_capabilities: [tenant.offboarding.request]
    four_eyes: REQUIRED
    self_approval: OWNER_WITH_STEP_UP
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [request_id, object_revision, "content_sha256 = sha256(dry-run manifest)"]
    followed_by: "OPS-005 second-operator approval on the ops plane"
    expires_after_days: 7
    owner_task: ONB-102
  sso.enforce:
    object_type: identity_provider
    maker_capabilities: [sso.enforce]
    checker_capabilities: [sso.approve]
    four_eyes: REQUIRED
    self_approval: OWNER_WITH_STEP_UP
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [identity_provider_id, object_revision, "content_sha256 = metadata_sha256", "binding_json.break_glass_membership_ids"]
    guards: ["idp status TESTED with tested_metadata_sha256 = metadata_sha256", ">= 1 and <= 2 break-glass owners with passkey MFA"]
    expires_after_days: 7
    owner_task: SEC-003
  sso.disable:
    object_type: identity_provider
    maker_capabilities: [sso.disable]
    checker_capabilities: [sso.approve]
    four_eyes: REQUIRED
    self_approval: OWNER_WITH_STEP_UP
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [identity_provider_id, object_revision, "content_sha256 = metadata_sha256"]
    expires_after_days: 7
    owner_task: SEC-003
  tenant.ownership.transfer:
    object_type: membership
    maker_capabilities: [tenant.ownership.transfer]
    checker_capabilities: []          # the TARGET member accepts (TARGET_ACCEPTANCE); no capability needed
    four_eyes: TARGET_ACCEPTANCE
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: true, approver: true, max_age_seconds: 600}
    binds: [source_membership_id, target_membership_id, "object_revision of both memberships"]
    expires_after_days: 7
    owner_task: CTL-003
  support.grant:
    object_type: support_access_grant
    maker_capabilities: []            # requested by an operator holding ops.support.request
    checker_capabilities: [support.grant]
    four_eyes: CUSTOMER_APPROVAL
    self_approval: NEVER
    tenant_overridable: []
    step_up: {requester: false, approver: true, max_age_seconds: 600}
    binds: [support_access_grant_id, support_scope, data_scope, duration]
    implemented_by: identity.support_access_grant   # approval recorded on the grant row, not identity.approval
    auto_approve: "health_read only, when tenant.setting.support_health_read_auto_approve = true"
    expires_after_days: 1
    owner_task: SEC-104

# Operator-plane four-eyes (not tenant approvals; recorded by the ops API with both operator ids in audit).
operator_approval_policies:
  ops.finance.payment.correct: {requires_second_operator: true, owner_task: LCH-001}
  ops.finance.subscription.transition: {requires_second_operator: true, applies_to: [SUSPENDED, CANCELLED], owner_task: LCH-001}
  ops.finance.entitlement.override: {requires_second_operator: true, applies_to: [above_plan], owner_task: LCH-101}
  ops.outbox.discard: {requires_second_operator: true, owner_task: CTL-004}
  ops.recovery.execute: {requires_second_operator: true, owner_task: OPS-106}
  ops.tenant.offboard: {requires_second_operator: true, owner_task: OPS-005}
