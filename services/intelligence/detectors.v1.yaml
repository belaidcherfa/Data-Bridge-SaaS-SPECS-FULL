- id: Q01
  version: 1.0.0
  name: Query family cost regression
  family: QUERY
  release: R1
  status: ACTIVE
  owner_task: INS-003
  qualification_gate: {required: true, min_precision: "0.8", min_reviewed: 10, record: null}
  resource: {type: QUERY_FAMILY, native_id: [query_parameterized_hash, hash_version], variant: warehouse_id}
  required_inputs:
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: QUERY_ID, used_for: EVIDENCE, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: START_TIME, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: WAREHOUSE_ID, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: EXECUTION_STATUS, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: QUERY_PARAMETERIZED_HASH, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: QUERY_PARAMETERIZED_HASH_VERSION, used_for: DETECTION, capability_key: QH_HASH_VERSION, projection: REQUESTED_ING101}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: QUERY_TAG, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE, note: "exclusion of bridge_finops:* families (G-INS-15)"}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_ATTRIBUTION_HISTORY, column: CREDITS_ATTRIBUTED_COMPUTE, used_for: DETECTION, capability_key: QAH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_ATTRIBUTION_HISTORY, column: CREDITS_USED_QUERY_ACCELERATION, used_for: DETECTION, capability_key: QAH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_METERING_HISTORY, column: CREDITS_USED_COMPUTE, used_for: DETECTION, capability_key: QMH, projection: REQUIRED_CORE, note: "Adaptive warehouses only, summed across hours"}
    - {kind: DATASET, dataset: fct_query_family_daily, used_for: DETECTION, capability_key: QH, projection: PRODUCED_DATASET, note: "WRK-104 D-11 aggregate (U-17); INS reads the view fct_ins_query_family_day"}
  feature_datasets: [fct_ins_query_family_day]
  eligibility: {min_history_days: 28, completeness: "every day of both cohorts complete in the family × day aggregate", backfill_eligible: true, maturity: PROVISIONAL}
  windows:
    evaluation_cadence: DAILY
    current: {kind: COHORT_CURRENT, unit: DAY, length: 14, offset: -13, note: "C = [D−13, D]"}
    baseline: {kind: COHORT_BASELINE, unit: DAY, length: 14, offset: -27, note: "B = [D−27, D−14]"}
  predicate:
    expression: "u = cost / executions_attributed per cohort; attribution coverage = executions_attributed / executions_success; QUALIFIED iff n_B ≥ q01.min_executions AND n_C ≥ q01.min_executions AND coverage_B ≥ q01.min_attribution_coverage AND coverage_C ≥ q01.min_attribution_coverage AND u_C / u_B − 1 > q01.unit_cost_rise_threshold AND impact_amount_30d > floor; cohorts with different hash_version are never compared"
    comparisons:
      - {metric: executions_baseline, op: GE, parameter: q01.min_executions}
      - {metric: executions_current, op: GE, parameter: q01.min_executions}
      - {metric: attribution_coverage_min, op: GE, parameter: q01.min_attribution_coverage}
      - {metric: unit_cost_rise, op: GT, parameter: q01.unit_cost_rise_threshold}
      - {metric: impact_amount_30d, op: GT, parameter: insights.impact_floor_30d}
  parameters: [q01.min_executions, q01.min_attribution_coverage, q01.unit_cost_rise_threshold, q01.cohort_days, insights.impact_floor_30d]
  impact:
    impact_kind: ESTIMATE
    window_amount: "unit_effect = (u_C − u_B) × n_C; decomposition identity cost_C − cost_B = unit_effect + volume_effect with volume_effect = (n_C − n_B) × u_B (asserted)"
    run_rate_30d: "unit_effect × 30 / 14"
    floor_policy: APPLY
    potential_method: Q01_UNIT_COST_RETURN
    potential_formula: "potential_30d = unit_effect × 30 / 14 — 'if unit cost returns to baseline'"
    ranking: MONETARY
    routing: INSIGHTS
  cost_pool: {kind: QUERY_FAMILY, member_role: ESTIMATE, group_note: "Q02/Q03 on the same family join the group with null potential"}
  suppressions:
    - {when: "attribution coverage < 0.90 in either cohort (short queries lack QAH rows)", status: SUPPRESSED, reason_code: ATTRIBUTION_COVERAGE}
    - {when: "QUERY_PARAMETERIZED_HASH_VERSION differs between cohorts", status: NO_OBSERVATION, reason_code: HASH_VERSION_CHANGED}
    - {when: "family QUERY_TAG starts with bridge_finops:", status: NO_OBSERVATION, reason_code: BRIDGE_OVERHEAD_EXCLUDED}
    - {when: "n_B < 10 or n_C < 10", status: INSUFFICIENT_DATA, reason_code: INSUFFICIENT_HISTORY}
    - {when: "QAH not active", status: SUPPRESSED, reason_code: "MISSING_CAPABILITY:QAH"}
    - {when: "QH_HASH_VERSION not projected", status: SUPPRESSED, reason_code: "MISSING_CAPABILITY:QH_HASH_VERSION"}
  severity:
    - {tier: HIGH, when: "unit_cost_rise > 1.00"}
    - {tier: MEDIUM, when: "otherwise"}
  action_types: [REWRITE_QUERY, RESIZE_WAREHOUSE]
  recommendation_template: q.cost_regression.v1
  evidence: "per-cohort executions, cost, unit cost, coverage; warehouse-size mix per cohort (confounder evidence); sample QUERY_IDs (≤ 20); sanitized text only for viewers holding sql_text.read_sanitized"
  fixtures:
    - id: Q01-F01
      kind: POSITIVE
      given: "B: 10 attributed executions costing 20.00 USD (u 2.00); C: 20 executions costing 60.00 USD (u 3.00); coverage 1.0 both"
      expected: {eligibility_status: QUALIFIED, severity_tier: MEDIUM, metrics: {unit_cost_rise: "0.5", unit_effect: "20.00", volume_effect: "20.00"}, impact_amount_window: "20.00", impact_amount_30d: "42.857142857143", potential_30d: "42.857142857143", currency: USD}
      arithmetic: "3/2 − 1 = 0.50 > 0.20; unit = (3 − 2) × 20 = 20; volume = (20 − 10) × 2 = 20; Δ = 60 − 20 = 40 = 20 + 20; 20 × 30 / 14 = 42.857142857142857… → 42.857142857143"
    - id: Q01-F02
      kind: BOUNDARY
      given: "u_B 2.00 → u_C 2.40 (+20 % exactly), n 10 → 10"
      expected: {eligibility_status: NOT_QUALIFIED, reason_code: EQUAL_AT_THRESHOLD, metrics: {unit_cost_rise: "0.2"}}
      arithmetic: "2.40 / 2.00 − 1 = 0.20; 0.20 > 0.20 false"
