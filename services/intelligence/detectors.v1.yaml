# contract=insight-detector-registry version=1 status=DRAFT owner_task=INS-001 decisions=D-01,D-05,D-08,D-10,D-11,D-13,D-20 last_changed=2026-09-28
# Detector registry v1 — validated by data/contracts/detector_manifest.schema.json (INS-001-S01/S02).
# Normative sources: docs/13-insights/intelligence.md (registry, amended 2026-09-28) and
# docs/22-implementation-readiness/backlog/INS.md (§2 input matrix, G-INS-01…21, INS-002/003/004 steps).
#
# Conventions used below
# - Money is native currency, Decimal precision 38; stored NUMBER(38,12) quantized ROUND_HALF_EVEN; JSON decimal strings.
# - run-rate: impact_amount_30d = impact_amount_window × 30 / window_days (G-INS-11). Floor: impact_amount_30d >
#   insights.impact_floor_30d[currency] (strict). Contract fixtures run with the floor at 0.00 unless the fixture
#   sets it (fixture `config`).
# - Strict thresholds: equality never qualifies → NOT_QUALIFIED(EQUAL_AT_THRESHOLD).
# - Fingerprint (G-INS-10): sha256("ins-fp-v1|" + tenant_id + "|" + detector_id + "|" + detector_major + "|" +
#   account_id + "|" + resource.type + "|" + native_resource_id + "|" + (variant or "")) — lowercase hex.
#   native_resource_id = resource.native_id values joined with ":". Names, windows, publications, numbers and minor
#   versions never enter the fingerprint.
# - Fixtures use rate 2.00 USD/credit and storage rate 23.00 USD per TB-month (fixture values only, never production).
# - Evaluation day D = the last complete UTC day of the pinned financial publication P (ADR-014 two-phase publication).
registry: insight-detectors
registry_version: 1.0.0
contract_header: {contract: insight-detector-registry, version: 1, status: DRAFT, owner_task: INS-001, decisions: [D-01, D-05, D-08, D-10, D-11, D-13, D-20], last_changed: "2026-09-28"}
parameter_catalog: data/contracts/insights/config_catalog.v1.yaml
projection_request: data/contracts/insights/source_projection_request.v1.yaml

cost_pool_kinds:
  WAREHOUSE_TOTAL: {key_template: "WAREHOUSE_TOTAL:{account_id}:{warehouse_id}:{currency}", parent: null, pool_cost: "Σ credits_used_compute × effective_rate over the window (fct_ins_wh_hourly), as 30-day run-rate", release: R1}
  WAREHOUSE_IDLE: {key_template: "WAREHOUSE_IDLE:{account_id}:{warehouse_id}:{currency}", parent: WAREHOUSE_TOTAL, pool_cost: "Σ idle_cost (fct_ins_wh_hourly), 30-day run-rate", release: R1}
  WAREHOUSE_ACTIVE: {key_template: "WAREHOUSE_ACTIVE:{account_id}:{warehouse_id}:{currency}", parent: WAREHOUSE_TOTAL, pool_cost: "Σ attributed query compute cost (ledger_query_compute via fct_ins_wh_hourly.attributed_cost), 30-day run-rate", release: R1}
  QUERY_FAMILY: {key_template: "QUERY_FAMILY:{account_id}:{warehouse_id}:{query_parameterized_hash}:{hash_version}:{currency}", parent: WAREHOUSE_ACTIVE, pool_cost: "Σ family cost in the current cohort (fct_ins_query_family_day.cost), 30-day run-rate", release: R1}
  ACCOUNT_CLOUD_SERVICES: {key_template: "ACCOUNT_CLOUD_SERVICES:{account_id}:{currency}", parent: null, pool_cost: "billed cloud-services cost over the baseline median day × 30 (fct_ins_cloud_services_daily)", release: R1}
  STORAGE_TABLE: {key_template: "STORAGE_TABLE:{account_id}:{table_id}:{currency}", parent: null, pool_cost: "mean physical bytes (active+TT+FS+RFC at owner) / tb_unit × storage rate per TB-month (fct_ins_table_storage_daily)", release: R1}
  STORAGE_TT: {key_template: "STORAGE_TT:{account_id}:{table_id}:{currency}", parent: STORAGE_TABLE, pool_cost: "mean TIME_TRAVEL_BYTES / tb_unit × rate", release: R1}
  STORAGE_FS: {key_template: "STORAGE_FS:{account_id}:{table_id}:{currency}", parent: STORAGE_TABLE, pool_cost: "mean FAILSAFE_BYTES / tb_unit × rate", release: R1}
  PIPELINE: {key_template: "PIPELINE:{account_id}:{pipeline_id}:{currency}", parent: null, pool_cost: "Σ charge components linked to the pipeline's exact executions (WRK-004)", release: R2}
  RETRY: {key_template: "RETRY:{account_id}:{logical_execution_id}:{currency}", parent: PIPELINE, pool_cost: "Σ charged failed attempts of the logical execution (counted once across Q08/PL04)", release: R2}
  AI_SERVICE: {key_template: "AI_SERVICE:{account_id}:{ai_family}:{ai_model}:{currency}", parent: null, pool_cost: "Σ parent-inclusive AI spend (FIN-018 authority layer)", release: R2}
  COMPUTE_POOL: {key_template: "COMPUTE_POOL:{account_id}:{compute_pool_id}:{currency}", parent: null, pool_cost: "Σ SPCS pool credits × rate (FIN-019)", release: R2}
  APPLICATION: {key_template: "APPLICATION:{account_id}:{compute_pool_id}:{application_id}:{currency}", parent: COMPUTE_POOL, pool_cost: "application-attributed pool cost (pool/app dedup)", release: R2}

detectors:
# =====================================================================================================================
# WAREHOUSE family (INS-002 R1; INS-106 R2)
# =====================================================================================================================
- id: WH01
  version: 1.0.0
  name: Warehouse idle cost
  family: WAREHOUSE
  release: R1
  status: ACTIVE
  owner_task: INS-002
  qualification_gate: {required: true, min_precision: "0.8", min_reviewed: 10, record: null}
  resource: {type: WAREHOUSE, native_id: [warehouse_id], variant: null}
  required_inputs:
    - {kind: SOURCE_COLUMN, source_id: AU_WAREHOUSE_METERING_HISTORY, column: START_TIME, used_for: DETECTION, capability_key: WMH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_WAREHOUSE_METERING_HISTORY, column: WAREHOUSE_ID, used_for: DETECTION, capability_key: WMH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_WAREHOUSE_METERING_HISTORY, column: CREDITS_USED_COMPUTE, used_for: DETECTION, capability_key: WMH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_WAREHOUSE_METERING_HISTORY, column: CREDITS_ATTRIBUTED_COMPUTE_QUERIES, used_for: DETECTION, capability_key: WMH, projection: REQUIRED_CORE}
    - {kind: DATASET, dataset: ledger_warehouse_idle, used_for: DETECTION, capability_key: WMH, projection: PRODUCED_DATASET, note: "FIN-003 classic idle ledger; Σ idle equals the ledger for the fixture (INS-002-S02)"}
    - {kind: DATASET, dataset: fct_rate, used_for: DETECTION, capability_key: WMH, projection: PRODUCED_DATASET, note: "FIN-002 effective rate; missing rate → money null NO_PRICE"}
    - {kind: SOURCE_COLUMN, source_id: SHOW_WAREHOUSES, column: AUTO_SUSPEND_S, used_for: EVIDENCE, capability_key: WAREHOUSE_CONFIG, projection: NEW_SOURCE_INS102, note: "only for the LOW-tier short-burst guard (INS-002-S04)"}
  feature_datasets: [fct_ins_wh_hourly, dim_warehouse_config]
  eligibility: {min_history_days: 14, completeness: "336 complete metering hours (hour complete = WMH COMPLETE_PARTITION accepted for the hour)", backfill_eligible: true, maturity: PROVISIONAL}
  windows:
    evaluation_cadence: DAILY
    current: {kind: TRAILING_COMPLETE, unit: HOUR, length: 336, note: "the 336 hours ending at D+1 00:00Z"}
    baseline: null
  predicate:
    expression: "idle_share = Σ idle_credits / Σ credits_used_compute over the window, idle_credits = max(0, CREDITS_USED_COMPUTE − CREDITS_ATTRIBUTED_COMPUTE_QUERIES) per hour; QUALIFIED iff idle_share > wh01.idle_share_threshold AND impact_amount_30d > floor"
    comparisons:
      - {metric: idle_share, op: GT, parameter: wh01.idle_share_threshold}
      - {metric: impact_amount_30d, op: GT, parameter: insights.impact_floor_30d}
  parameters: [wh01.idle_share_threshold, wh01.high_tier_threshold, wh01.window_hours, wh01.short_burst_auto_suspend_s, insights.impact_floor_30d]
  impact:
    impact_kind: CEILING
    window_amount: "Σ_h idle_credits_h × effective_rate_h (native currency)"
    run_rate_30d: "window_amount × 30 / 14"
    floor_policy: APPLY
    potential_method: null
    potential_formula: null
    ranking: MONETARY
    routing: INSIGHTS
  cost_pool: {kind: WAREHOUSE_IDLE, member_role: CEILING, group_note: "WH01 caps every estimate on WAREHOUSE_IDLE(w); it never adds potential (WH01 60 + WH02 45 → 45)"}
  suppressions:
    - {when: "warehouse type ADAPTIVE (CON-005 flag, RECONCILIATION C-22): attributed credits are null", status: SUPPRESSED, reason_code: ADAPTIVE_UNSUPPORTED}
    - {when: "fewer than 336 complete hours in the window", status: INSUFFICIENT_DATA, reason_code: INCOMPLETE_COVERAGE}
    - {when: "WMH not active for the account", status: SUPPRESSED, reason_code: "MISSING_CAPABILITY:WMH"}
    - {when: "effective rate missing for any hour", status: SUPPRESSED, reason_code: NO_PRICE, estimate_only: false}
    - {when: "Σ credits_used_compute = 0", status: INSUFFICIENT_DATA, reason_code: ZERO_DENOMINATOR}
  severity:
    - {tier: HIGH, when: "idle_share > wh01.high_tier_threshold (0.50) — the WH04 alias"}
    - {tier: LOW, when: "known AUTO_SUSPEND_S ≤ wh01.short_burst_auto_suspend_s (60): idle dominated by the 60-s resume minimum/short bursts; template wh.idle_short_bursts.v1"}
    - {tier: MEDIUM, when: "otherwise"}
  action_types: [CHANGE_AUTO_SUSPEND, CHANGE_WAREHOUSE_SCHEDULE, CONSOLIDATE_WAREHOUSES]
  recommendation_template: wh.idle.v1
  evidence: "top 20 idle hours (hour, credits_used, attributed, idle, cost); config snapshot id + valid_from; BRIDGE_FINOPS_WH labelled 'Bridge overhead' (D-08)"
  fixtures:
    - id: WH01-F01
      kind: POSITIVE
      given: "classic warehouse, 336 complete hours; metered 100 cr (200.00 USD), attributed 70 cr (140.00 USD), idle 30 cr (60.00 USD) at 2.00 USD/credit"
      expected: {eligibility_status: QUALIFIED, severity_tier: MEDIUM, metrics: {idle_share: "0.3"}, impact_amount_window: "60.00", impact_amount_30d: "128.571428571429", potential_30d: null, currency: USD}
      arithmetic: "idle_share = 30/100 = 0.30 > 0.25; window = 30 × 2.00 = 60.00; run-rate = 60 × 30 / 14 = 128.5714285714285714… → 128.571428571429 (12 dp, HALF_EVEN); 128.571428571429 > 25.00 floor"
    - id: WH01-F02
      kind: BOUNDARY
      given: "same, idle 25 cr of 100 cr (50.00 of 200.00 USD)"
      expected: {eligibility_status: NOT_QUALIFIED, reason_code: EQUAL_AT_THRESHOLD, metrics: {idle_share: "0.25"}}
      arithmetic: "25/100 = 0.25; 0.25 > 0.25 is false"
    - id: WH01-F03
      kind: POSITIVE
      given: "idle 60 cr of 100 cr (120.00 of 200.00 USD)"
      expected: {eligibility_status: QUALIFIED, severity_tier: HIGH, metrics: {idle_share: "0.6"}, impact_amount_window: "120.00", impact_amount_30d: "257.142857142857", potential_30d: null, currency: USD, note: "WH04 alias: no separate WH04 insight"}
      arithmetic: "60/100 = 0.60 > 0.50 → HIGH; 120 × 30 / 14 = 257.142857142857142… → 257.142857142857"
    - id: WH01-F04
      kind: SUPPRESSION
      given: "Adaptive warehouse; CREDITS_ATTRIBUTED_COMPUTE_QUERIES null"
      expected: {eligibility_status: SUPPRESSED, reason_code: ADAPTIVE_UNSUPPORTED}
      arithmetic: "no idle estimate for Adaptive warehouses"
    - id: WH01-F05
      kind: NEGATIVE
      given: "335 of 336 hours complete (one WMH hour not accepted)"
      expected: {eligibility_status: INSUFFICIENT_DATA, reason_code: INCOMPLETE_COVERAGE}
      arithmetic: "335 < 336 required complete hours"
    - id: WH01-F06
      kind: NEGATIVE
      given: "hours where attributed (5 cr) > used (4 cr) plus otherwise idle-free hours"
      expected: {eligibility_status: NOT_QUALIFIED, reason_code: PREDICATE_NOT_MET, metrics: {idle_share: "0"}, note: "residual_flag set; negative idle never emitted"}
      arithmetic: "idle = max(0, 4 − 5) = 0"
    - id: WH01-F07
      kind: FALSE_POSITIVE
      given: "5-s jobs every 10 min, AUTO_SUSPEND 60 s (known), idle 30/100 cr"
      expected: {eligibility_status: QUALIFIED, severity_tier: LOW, potential_30d: null, note: "template wh.idle_short_bursts.v1 (review consolidation); WH02 NOT_QUALIFIED (AS 60 ≤ 300) so the group has no estimate — shown 'up to 128.57', never 0"}
      arithmetic: "AS 60 ≤ 60 → LOW tier guard"
    - id: WH01-F08
      kind: GROUPING
      given: "WH01 ceiling 60.00 (30-d) and WH02 potential 45.00 (30-d) on WAREHOUSE_IDLE(w); pool cost 60.00"
      expected: {eligibility_status: QUALIFIED, group_value_30d: "45.00"}
      arithmetic: "value = min(pool 60, ceiling 60, max(45, Σ children 0)) = 45"
- id: WH02
  version: 1.0.0
  name: Auto-suspend setting
  family: WAREHOUSE
  release: R1
  status: ACTIVE
  owner_task: INS-002
  qualification_gate: {required: true, min_precision: "0.8", min_reviewed: 10, record: null}
  resource: {type: WAREHOUSE, native_id: [warehouse_id], variant: null}
  required_inputs:
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: START_TIME, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: END_TIME, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: WAREHOUSE_ID, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: WAREHOUSE_SIZE, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: EXECUTION_TIME, used_for: DETECTION, capability_key: QH, projection: REQUIRED_CORE}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: CLUSTER_NUMBER, used_for: ESTIMATE, capability_key: QH_CLUSTER_NUMBER, projection: REQUESTED_ING101}
    - {kind: SOURCE_COLUMN, source_id: AU_QUERY_HISTORY, column: WAREHOUSE_TYPE, used_for: ESTIMATE, capability_key: QH_WAREHOUSE_TYPE, projection: REQUESTED_ING101}
    - {kind: SOURCE_COLUMN, source_id: SHOW_WAREHOUSES, column: AUTO_SUSPEND_S, used_for: DETECTION, capability_key: WAREHOUSE_CONFIG, projection: NEW_SOURCE_INS102}
    - {kind: SOURCE_COLUMN, source_id: SHOW_WAREHOUSES, column: WAREHOUSE_SIZE, used_for: ESTIMATE, capability_key: WAREHOUSE_CONFIG, projection: NEW_SOURCE_INS102}
    - {kind: SOURCE_COLUMN, source_id: SHOW_WAREHOUSES, column: WAREHOUSE_TYPE, used_for: ESTIMATE, capability_key: WAREHOUSE_CONFIG, projection: NEW_SOURCE_INS102}
    - {kind: SOURCE_COLUMN, source_id: SHOW_WAREHOUSES, column: GENERATION, used_for: ESTIMATE, capability_key: WAREHOUSE_CONFIG, projection: NEW_SOURCE_INS102}
    - {kind: SOURCE_COLUMN, source_id: AU_WAREHOUSE_METERING_HISTORY, column: CREDITS_USED_COMPUTE, used_for: ESTIMATE, capability_key: WMH, projection: REQUIRED_CORE, note: "calibration guard (INS-002-S07)"}
    - {kind: DATASET, dataset: fct_rate, used_for: ESTIMATE, capability_key: WMH, projection: PRODUCED_DATASET}
  feature_datasets: [fct_ins_wh_busy_intervals, fct_ins_wh_hourly, dim_warehouse_config]
  eligibility: {min_history_days: 14, completeness: "14 complete UTC days of QH (hot tier ≤ hot_days) and WMH for the warehouse", backfill_eligible: true, maturity: PROVISIONAL}
  windows:
    evaluation_cadence: DAILY
    current: {kind: TRAILING_COMPLETE, unit: DAY, length: 14}
    baseline: null
  predicate:
    expression: "Busy intervals = union of [START_TIME, END_TIME] per (warehouse_id, cluster_number) for queries with EXECUTION_TIME > 0 and non-null WAREHOUSE_SIZE; gaps g between busy intervals while the warehouse is running. AS_cur from dim_warehouse_config (as-of join); disabled (0/NULL) = ∞. QUALIFIED iff AS_cur > wh02.qualifying_auto_suspend_s (or disabled) AND count(gaps with g ≥ AS_tgt) ≥ wh02.min_gaps AND calibration relative error ≤ wh02.calibration_max_rel_error AND impact_amount_30d > floor"
    comparisons:
      - {metric: auto_suspend_current_s, op: GT, parameter: wh02.qualifying_auto_suspend_s}
      - {metric: qualifying_gap_count, op: COUNT_GE, parameter: wh02.min_gaps}
      - {metric: calibration_rel_error, op: LE, parameter: wh02.calibration_max_rel_error}
      - {metric: impact_amount_30d, op: GT, parameter: insights.impact_floor_30d}
  parameters: [wh02.target_auto_suspend_s, wh02.qualifying_auto_suspend_s, wh02.min_gaps, wh02.window_days, wh02.calibration_max_rel_error, wh02.resume_minimum_s, insights.impact_floor_30d]
  impact:
    impact_kind: ESTIMATE
    window_amount: "min(WH01 idle cost of the same warehouse and window, Σ_g saving_s(g) × k(size, type, generation) / 3600 × effective_rate)"
    run_rate_30d: "window_amount × 30 / 14"
    floor_policy: APPLY
    potential_method: WH02_GAP_SIMULATION
    potential_formula: "per gap g: t_cur = min(g, AS_cur) (disabled → g); t_tgt = min(g, AS_tgt); penalty = [AS_tgt < g ≤ AS_cur] × max(0, wh02.resume_minimum_s − b_next) where b_next = length of the next busy period; saving_s = t_cur − t_tgt − penalty; potential_30d = impact_amount_30d; k from config/warehouse_credit_rates.v1.json"
    ranking: MONETARY
    routing: INSIGHTS
  cost_pool: {kind: WAREHOUSE_IDLE, member_role: ESTIMATE, group_note: "group value = min(WH01 cap, WH02 estimate); the property test holds for any gap set (INS-002-S09)"}
  suppressions:
    - {when: "warehouse absent from the SHOW_WAREHOUSES snapshot (config unknown)", status: SUPPRESSED, reason_code: "MISSING_CAPABILITY:WAREHOUSE_CONFIG"}
    - {when: "size/type/generation has no entry in warehouse_credit_rates (unknown or TO VERIFY LIVE rate)", status: SUPPRESSED, reason_code: UNKNOWN_CREDIT_RATE}
    - {when: "modeled (busy + tail) credits vs WMH CREDITS_USED_COMPUTE per warehouse-day relative error > 0.10 (e.g. hidden second cluster without CLUSTER_NUMBER)", status: SUPPRESSED, reason_code: CALIBRATION_FAILED}
    - {when: "warehouse type ADAPTIVE", status: SUPPRESSED, reason_code: ADAPTIVE_UNSUPPORTED}
    - {when: "fewer than 14 complete days", status: INSUFFICIENT_DATA, reason_code: INCOMPLETE_COVERAGE}
  severity:
    - {tier: HIGH, when: "AS_cur disabled (never suspends)"}
    - {tier: MEDIUM, when: "otherwise"}
  action_types: [CHANGE_AUTO_SUSPEND]
  recommendation_template: wh.auto_suspend.v1
  evidence: "≤ 50 gap samples (start, end, length_s, next_busy_s, saving_s, UTC ISO-8601); config snapshot id + valid_from; calibration table per day; copyable display-only text ALTER WAREHOUSE <quoted name> SET AUTO_SUSPEND = 60 with rollback line"
  fixtures:
    - id: WH02-F01
      kind: POSITIVE
      given: "MEDIUM classic Gen1 (4 cr/h), AS_cur 600 s → AS_tgt 60 s; 3 gaps/day × 14 d of 600 s each, b_next ≥ 60 s; rate 2.00 USD/credit; WH01 idle cost ≥ 50.40"
      expected: {eligibility_status: QUALIFIED, severity_tier: MEDIUM, metrics: {qualifying_gap_count: "42", saving_credits: "25.2"}, impact_amount_window: "50.40", impact_amount_30d: "108.00", potential_30d: "108.00", currency: USD}
      arithmetic: "per gap t_cur = min(600,600) = 600, t_tgt = min(600,60) = 60, penalty 0 → 540 s; 42 × 540 = 22 680 s; × 4 / 3600 = 25.2 cr; × 2.00 = 50.40 USD; × 30 / 14 = 108.00"
    - id: WH02-F02
      kind: POSITIVE
      given: "as WH02-F01 but every next busy period b_next = 20 s"
      expected: {eligibility_status: QUALIFIED, impact_amount_window: "46.666666666667", impact_amount_30d: "100.000000000000", potential_30d: "100.000000000000", currency: USD}
      arithmetic: "penalty = [60 < 600 ≤ 600] × max(0, 60 − 20) = 40 s; saving 600 − 60 − 40 = 500 s; 42 × 500 = 21 000 s × 4 / 3600 = 23.333… cr × 2.00 = 46.666… USD (→ 46.666666666667); 30-d = 21000 × 8 × 30 / (3600 × 14) = 100 exactly"
    - id: WH02-F03
      kind: BOUNDARY
      given: "AS_cur = 300 s, otherwise as WH02-F01"
      expected: {eligibility_status: NOT_QUALIFIED, reason_code: EQUAL_AT_THRESHOLD}
      arithmetic: "300 > 300 is false"
    - id: WH02-F04
      kind: POSITIVE
      given: "AUTO_SUSPEND disabled (0), gaps as WH02-F01"
      expected: {eligibility_status: QUALIFIED, severity_tier: HIGH, impact_amount_window: "50.40", currency: USD, note: "t_cur = g when disabled"}
      arithmetic: "t_cur = g = 600; identical to F01 because every gap is 600 s"
    - id: WH02-F05
      kind: MISSING_CAPABILITY
      given: "warehouse metered in WMH but absent from the SHOW_WAREHOUSES snapshot"
      expected: {eligibility_status: SUPPRESSED, reason_code: "MISSING_CAPABILITY:WAREHOUSE_CONFIG"}
      arithmetic: "absent settings suppress the setting recommendation"
    - id: WH02-F06
      kind: FLOOR
      given: "contract fixture: XS (1 cr/h), AS 600 → 60, three 600-s gaps in 14 d, floor 0.00"
      config: {insights.impact_floor_30d: "0.00"}
      expected: {eligibility_status: QUALIFIED, impact_amount_window: "0.90", impact_amount_30d: "1.928571428571", currency: USD}
      arithmetic: "3 × 540 × 1 / 3600 = 0.45 cr × 2.00 = 0.90 USD; 0.90 × 30 / 14 = 1.92857142857142857 → 1.928571428571"
    - id: WH02-F07
      kind: FLOOR
      given: "same as WH02-F06 with the production floor 25.00 USD"
      config: {insights.impact_floor_30d: "25.00"}
      expected: {eligibility_status: NOT_QUALIFIED, reason_code: BELOW_IMPACT_FLOOR, impact_amount_30d: "1.928571428571", currency: USD}
      arithmetic: "1.928571428571 > 25.00 is false"
    - id: WH02-F08
      kind: FALSE_POSITIVE
      given: "multi-cluster warehouse, second cluster busy, CLUSTER_NUMBER not projected → modeled credits 60 % of WMH"
      expected: {eligibility_status: SUPPRESSED, reason_code: CALIBRATION_FAILED, note: "WH01 ceiling only"}
      arithmetic: "|modeled − metered| / metered = 0.40 > 0.10"
- id: WH03
  version: 1.0.0
  name: Rightsizing experiment candidate
  family: WAREHOUSE
  release: R2
  status: PLANNED
  owner_task: INS-106
  original_owner_task: INS-002
  resource: {type: WAREHOUSE, native_id: [warehouse_id], variant: null}
  required_inputs:
    - {kind: SOURCE_COLUMN, source_id: AU_WAREHOUSE_LOAD_HISTORY, column: AVG_RUNNING, used_for: DETECTION, capability_key: WAREHOUSE_LOAD, projection: R2_ADAPTER}
    - {kind: SOURCE_COLUMN, source_id: AU_WAREHOUSE_LOAD_HISTORY, column: AVG_QUEUED_LOAD, used_for: DETECTION, capability_key: WAREHOUSE_LOAD, projection: R2_ADAPTER}
    - {kind: SOURCE_COLUMN, source_id: AU_WAREHOUSE_LOAD_HISTORY, column: AVG_QUEUED_PROVISIONING, used_for: DETECTION, capability_key: WAREHOUSE_LOAD, projection: R2_ADAPTER}
