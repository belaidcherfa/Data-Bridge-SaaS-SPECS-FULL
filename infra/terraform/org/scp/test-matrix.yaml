  - {id: SCP-16, scp: bridge-scp-deny-iam-users, principal: "role/bridge-break-glass", call: "iam:CreateUser --user-name scp-test (then delete)", expect: ALLOW}
  - {id: SCP-17, scp: bridge-scp-deny-kms-deletion, principal: "role/bridge-dev-tf-apply", call: "kms:ScheduleKeyDeletion (test key)", expect: DENY_SCP}
  - {id: SCP-18, scp: bridge-scp-deny-kms-deletion, principal: "role/bridge-dev-tf-apply", call: "kms:PutKeyPolicy (test key)", expect: ALLOW}
  - {id: SCP-19, scp: bridge-scp-deny-kms-deletion, principal: "role/bridge-dev-tf-plan", call: "kms:PutKeyPolicy (test key)", expect: DENY_SCP}
  - {id: SCP-20, scp: bridge-scp-prod-ecs-exec, account: prod, principal: "BridgeOperator session", call: "ecs:ExecuteCommand --container api", expect: DENY_SCP, verify_live: true}
  - {id: SCP-21, scp: bridge-scp-prod-ecs-exec, account: prod, principal: "BridgeOperator session", call: "ecs:ExecuteCommand --container ops-bastion", expect: ALLOW, verify_live: true}
  - {id: SCP-22, scp: bridge-scp-prod-ecs-exec, account: prod, principal: "role/bridge-prod-deploy", call: "ecs:UpdateService --enable-execute-command (service api)", expect: DENY_SCP, verify_live: true}
  - {id: SCP-23, scp: bridge-scp-runtime-role-guard, principal: "role/bridge-dev-identity-provisioner", call: "iam:CreateRole bridge-dev-conn-<uuid32> without boundary", expect: DENY_SCP}
  - {id: SCP-24, scp: bridge-scp-runtime-role-guard, principal: "role/bridge-dev-identity-provisioner", call: "iam:CreateRole bridge-dev-conn-<uuid32> with boundary bridge-dev-srv-boundary", expect: DENY_SCP}
