additivity: {across_dimensions: ALL, across_time: SUM, top_n_other: SUM_MEMBERS}
dimensions: [day, week, month, organization, account, region, cloud, scope_kind, service_category, service_family, service_type, sub_service, rating_type, billing_type, currency, is_adjustment,
  data_status, price_basis]
incompatible_dimensions:
- dimension: group
  reason: NOT_AT_GRAIN
  alternatives: []
  message_key: problem.QUERY_DIMENSION_INCOMPATIBLE.use_allocated_spend
- dimension: group_ancestor
  reason: NOT_AT_GRAIN
  alternatives: []
  message_key: problem.QUERY_DIMENSION_INCOMPATIBLE.use_allocated_spend
- dimension: group_set
  reason: NOT_AT_GRAIN
  alternatives: []
  message_key: problem.QUERY_DIMENSION_INCOMPATIBLE.use_allocated_spend
- dimension: book
  reason: NOT_AT_GRAIN
  alternatives: []
  message_key: problem.QUERY_DIMENSION_INCOMPATIBLE.use_allocated_spend
- dimension: allocation_method
  reason: NOT_AT_GRAIN
  alternatives: []
  message_key: problem.QUERY_DIMENSION_INCOMPATIBLE.use_allocated_spend
- dimension: component_kind
  reason: NOT_AT_GRAIN
  alternatives: []
  message_key: problem.QUERY_DIMENSION_INCOMPATIBLE.use_allocated_spend
- dimension: schema
  reason: NO_ATTRIBUTION_PATH
  alternatives: [database]
  message_key: problem.QUERY_DIMENSION_INCOMPATIBLE.no_attribution_path
- dimension: tag
  reason: NOT_AT_GRAIN
  alternatives: []
  message_key: problem.QUERY_DIMENSION_INCOMPATIBLE.use_allocated_spend
required_sources: [ou.usage_in_currency_daily, au.metering_daily_history]
maturity_policy: {data_status_column: data_status, composition: true, maturity_filter: true, reconciliation_applies: true, close_applies: true}
null_policy: {unpriced_rows: NULL_WHOLE_VALUE, empty_population: ZERO, scope_not_applicable_reason: NOT_APPLICABLE}
