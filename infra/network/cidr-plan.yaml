      az: c
      cidr: 10.10.8.128/26
      reserved: true
      route_table: null
    route_tables:
      rt-public:
      - destination: 10.10.0.0/16
        target: local
      - destination: 0.0.0.0/0
        target: igw
      rt-app-a:
