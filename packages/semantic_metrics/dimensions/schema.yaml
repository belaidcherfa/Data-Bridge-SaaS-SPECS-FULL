# contract=semantic-dimension:schema version=1 status=DRAFT owner_task=API-001 decisions=D-10,D-11,D-12,D-18 last_changed=2026-09-28
# v1 dimension catalog (API-001-S07; API.md §3.2).
id: schema
version: 1
status: ACTIVE
release: R1
label_key: dimension.schema.label
description_key: dimension.schema.description
group: RESOURCE
kind: ENTITY
value_type: UUID
cardinality_class: HIGH
entitlement: {is_entitlement_dimension: false}
privacy: {class: CUSTOMER_METADATA}
filter_ops: [EQ, IN, NOT_IN, IS_NULL, IS_NOT_NULL]
max_filter_values: 500
autocomplete: {enabled: true, min_prefix: 2, max_results: 20, source_relation: v_dim_resource, match_column: resource_name}
label: {source: DICTIONARY_RELATION, relation: v_dim_resource, key_column: resource_id, label_column: resource_name}
bindings:
- {relation: v_storage_daily, column_ref: schema_id}
- {relation: v_query_exec, column_ref: schema_id}
sortable: true
owner_task: API-001
notes: Storage bytes and query records only; never a cost dimension in R1.
