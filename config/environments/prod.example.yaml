# contract=owner-environment-config-template version=1 status=DRAFT owner_task=INF-001 decisions=D-09,D-21,D-23,D-25,D-31 last_changed=2026-09-28
# TEMPLATE for config/environments/prod.yaml (PROD workload account + BRIDGE_PROD Snowflake account).
#
#   cp config/environments/prod.example.yaml config/environments/prod.yaml
#   replace every <PLACEHOLDER>; then: make config-validate
#
# NOTHING IN THIS FILE IS A SECRET (see config/README.md). PROD Snowflake humans are the named break-glass
# administrators only; they are managed in the IdP, not listed here.

schema_version: 1
environment: prod

organization:                                   # must equal the dev and staging files
  aws_organization_id: "<AWS_ORGANIZATION_ID>"
  management_account_id: "<AWS_MANAGEMENT_ACCOUNT_ID>"
  security_account_id: "<AWS_SECURITY_ACCOUNT_ID>"
  log_archive_account_id: "<AWS_LOG_ARCHIVE_ACCOUNT_ID>"
  shared_services_account_id: "<AWS_SHARED_SERVICES_ACCOUNT_ID>"
  account_email_domain: "<ACCOUNT_EMAIL_DOMAIN>"
  identity_center:
    instance_arn: "<IDENTITY_CENTER_INSTANCE_ARN>"
    identity_store_id: "<IDENTITY_STORE_ID>"
    region: eu-west-1
    external_idp: NONE

aws:
  account_id: "<AWS_ACCOUNT_ID_PROD>"
  region: eu-west-1
  global_region: us-east-1
  az_ids: ["<AZ_ID_A>", "<AZ_ID_B>"]
  reserved_az_id: "<AZ_ID_C>"
  support_plan: BUSINESS                         # recommended for quota and incident escalation (INF owner question 5)

dns:
  apex_domain: "<APEX_DOMAIN>"
  apex_hosted_zone_id: "<APEX_HOSTED_ZONE_ID>"
  environment_zone_name: "<PROD_ZONE_NAME>"      # the apex itself or prod.<apex>
  app_hostname: "<PROD_APP_HOSTNAME>"            # e.g. app.<apex>
  auth_hostname: "<PROD_AUTH_HOSTNAME>"          # e.g. auth.<apex>
  docs_hostname: "<PROD_DOCS_HOSTNAME>"          # e.g. docs.<apex> (optional; delete the line if unused)
  email:
    sender_domain: "<PROD_EMAIL_SENDER_DOMAIN>"  # e.g. notify.<apex>
    mail_from_domain: "<PROD_MAIL_FROM_DOMAIN>"  # e.g. mail.notify.<apex>
    from_address: "<PROD_FROM_ADDRESS>"          # e.g. no-reply@notify.<apex>
    reply_to_address: "<SUPPORT_ADDRESS>"        # role mailbox (LCH-104 support policy)
    dmarc_report_address: "<DMARC_REPORT_ADDRESS>"
    dmarc_policy: NONE                           # → QUARANTINE after 30 clean days (G-INF-15)

github:
  organization: "<GITHUB_ORG>"
  repository: "<GITHUB_REPO>"
  repository_owner_id: "<GITHUB_REPOSITORY_OWNER_ID>"
  repository_id: "<GITHUB_REPOSITORY_ID>"
  environment_name: prod                         # GitHub environment with required reviewer ≠ author (INF-007-S08)
  runner_label: bridge-prod-vpc
  visibility: PUBLIC

snowflake:
  central:                                       # BRIDGE_PROD (Enterprise, AWS eu-west-1)
    organization_name: "<SNOWFLAKE_ORG_NAME>"
    account_name: "<SNOWFLAKE_PROD_ACCOUNT_NAME>"
    account_locator: "<SNOWFLAKE_PROD_LOCATOR>"
    region: AWS_EU_WEST_1
    cloud: AWS
    edition: ENTERPRISE
  sso:                                           # named break-glass administrators only
    idp_issuer: "<SNOWFLAKE_SSO_IDP_ISSUER>"
    idp_sso_url: "<SNOWFLAKE_SSO_IDP_SSO_URL>"
    idp_certificate_ssm_parameter: "/bridge/prod/snowflake/sso/idp-certificate"

notifications:
  ops_alert_email: "<OPS_ALERT_EMAIL>"
  cost_alert_email: "<COST_ALERT_EMAIL>"
  security_alert_email: "<SECURITY_ALERT_EMAIL>"
  chat_webhook_secret_name: "bridge/prod/notifications/ops-chat-webhook"
  test_destinations:
    email_recipients: ["<TEST_INBOX_EMAIL_1>"]   # synthetic canary/probe deliveries only (OPS-103, OPS-110)
    webhook_receiver_url: "<TEST_WEBHOOK_RECEIVER_URL>"

budgets:
  aws_monthly_usd: "2500"
  organization_accounts_monthly_usd: "40"
  actual_alert_pct: [80, 100]
  forecast_alert_pct: [100]
  anomaly_absolute_usd: "100"
  anomaly_relative_pct: 15
  snowflake_central_monthly_credits: "600"       # PROD account monitor is NOTIFY-ONLY (serving must never be suspended, INF-008-S09)
  snowflake_nonprod_ceiling_credits: "500"

egress:
  eip_allocation_ids: []                         # allocated once by INF-002 (applied by REL-104), prevent_destroy
  public_ips: []

features:
  interface_endpoints: true                      # 9 endpoints × 2 AZ
  guardduty_ecs_runtime_monitoring: false        # owner decision pending (INF owner question 7)
  security_hub_fsbp: true
  snowflake_account_network_policy: true
  dev_off_hours_scale_to_zero: false
  broker_transport: VPC_LATTICE_SIGV4
  dagster_admin_webserver: false
  dns_firewall_custom_allowlist_mode: ALERT
  waf_anonymous_ip_mode: COUNT
  cur_export: true                               # organization-wide CUR 2.0 export for OPS-009 (INF-105-S05)
