id: query_elapsed_p95
version: 1
status: ACTIVE
release: R1
support: SUPPORTED
label_key: metric.query_elapsed_p95.label
description_key: metric.query_elapsed_p95.description
population_key: metric.query_elapsed_p95.population
category: PERFORMANCE
