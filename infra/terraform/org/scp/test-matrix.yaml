  - {id: SCP-27, scp: bridge-scp-runtime-role-guard, principal: "role/bridge-dev-identity-provisioner", call: "iam:DeleteRolePermissionsBoundary on bridge-dev-conn-<uuid32>", expect: DENY_SCP}
  - {id: SCP-28, scp: bridge-scp-runtime-role-guard, principal: "role/bridge-dev-identity-provisioner", call: "iam:AttachRolePolicy arn:aws:iam::aws:policy/AdministratorAccess to bridge-dev-conn-<uuid32>", expect: DENY_SCP}
  - {id: SCP-29, scp: bridge-scp-runtime-role-guard, principal: "BridgeDeveloper session (dev)", call: "sts:AssumeRole bridge-dev-conn-<uuid32>", expect: DENY_SCP}
  - {id: SCP-30, scp: bridge-scp-runtime-role-guard, principal: "role/bridge-dev-analysis-worker", call: "sts:AssumeRole bridge-dev-srv-<uuid32>", expect: DENY_SCP}
  - {id: SCP-31, scp: bridge-scp-runtime-role-guard, principal: "role/bridge-dev-query-broker", call: "sts:AssumeRole bridge-dev-srv-<uuid32>", expect: ALLOW}
  - {id: SCP-32, scp: bridge-scp-runtime-role-guard, principal: "role/bridge-dev-dagster-daemon", call: "iam:PassRole bridge-dev-conn-<uuid32> to ecs-tasks.amazonaws.com (via ecs:RunTask override)", expect: DENY_SCP}
  - {id: SCP-33, scp: bridge-scp-runtime-role-guard, principal: "role/bridge-dev-extraction-launcher", call: "iam:PassRole bridge-dev-conn-<uuid32> (via ecs:RunTask override of bridge-dev-extractor)", expect: ALLOW}
  - {id: SCP-34, scp: bridge-scp-runtime-role-guard, principal: "BridgeAdmin session (dev, human-only gate)", call: "iam:CreatePolicyVersion on bridge-dev-conn-boundary", expect: ALLOW}
  - {id: SCP-35, scp: bridge-scp-runtime-role-guard, principal: "role/bridge-dev-tf-apply", call: "iam:CreatePolicyVersion on bridge-dev-conn-boundary (INF-102-S02: apply role never edits boundaries)", expect: DENY_SCP}
  - {id: SCP-36, scp: bridge-scp-deny-all-suspended, principal: "any role in an account moved to suspended", call: "s3:ListAllMyBuckets", expect: DENY_SCP}
